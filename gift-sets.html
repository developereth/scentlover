<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Sets | Scent Lovers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --gold: #D4A853; --gold-dark: #B8933F; --black: #0A0A0A; }
        body { font-family: 'Inter', sans-serif; background: var(--black); color: white; }
        .topbar { background: #000; text-align: center; padding: 10px; font-size: 0.75rem; border-bottom: 1px solid rgba(212,168,83,0.2); display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        .topbar i { color: var(--gold); }
        .nav-bar { background: rgba(10,10,10,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(212,168,83,0.2); position: sticky; top: 0; z-index: 1000; padding: 0 2rem; }
        .nav-inner { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 0; }
        .logo-text { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--gold); text-decoration: none; }
        .logo-text span { display: block; font-size: 0.55rem; color: #BBB; letter-spacing: 3px; }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; }
        .nav-links a { text-decoration: none; color: #bbb; transition: 0.3s; font-size: 0.9rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .mobile-menu-btn { display: none; background: var(--gold); border: none; color: #000; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
        @media (max-width: 768px) {
            .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
            .nav-links { position: fixed; top: 0; right: -100%; width: 80%; max-width: 320px; height: 100vh; background: #111; flex-direction: column; justify-content: center; gap: 25px; transition: 0.3s; z-index: 999; padding: 60px 20px; }
            .nav-links.show { right: 0; }
            .nav-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 998; }
            .nav-overlay.show { display: block; }
        }
        .page-header { background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 100%), url('https://images.unsplash.com/photo-1594035910387-fea47794261f?w=1600&q=80') center/cover no-repeat; padding: 90px 20px 70px; text-align: center; }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--gold); }
        .container { max-width: 1300px; margin: 0 auto; padding: 0 2rem; }
        .section { padding: 60px 0; }
        .section-header { text-align: center; margin-bottom: 50px; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 2.3rem; }
        .section-title span { color: var(--gold); }
        .section-line { width: 60px; height: 3px; background: var(--gold); margin: 15px auto; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        .product-card { background: #111; border-radius: 20px; overflow: hidden; border: 1px solid rgba(212,168,83,0.15); transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .product-card-img { height: 250px; overflow: hidden; position: relative; background: #1a1a1a; }
        .product-card-img img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .product-card:hover .product-card-img img { transform: scale(1.05); }
        .product-card-tag { position: absolute; top: 12px; left: 12px; background: var(--gold); color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; }
        .product-card-body { padding: 18px; }
        .brand { font-size: 0.7rem; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; }
        .product-card-body h4 { margin: 5px 0; font-size: 0.95rem; }
        .price { font-size: 1.2rem; font-weight: 700; color: var(--gold); display: block; margin: 10px 0; }
        .order-btn { width: 100%; background: var(--gold); color: #000; border: none; padding: 10px; border-radius: 40px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
        .order-btn:hover { background: var(--gold-dark); }
        .footer { background: #000; padding: 40px 20px; text-align: center; border-top: 1px solid rgba(212,168,83,0.1); margin-top: 40px; color: #888; }
        @media (max-width: 768px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; } .page-header h1 { font-size: 2rem; } }
    </style>
</head>
<body>
<div class="topbar"><div><i class="fas fa-truck"></i> Free Delivery Over 5,000 ETB</div><div><i class="fas fa-gift"></i> 2 Free Samples with Every Order</div></div>
<header class="nav-bar"><div class="nav-inner">
    <a href="index.html" class="logo-text">Scent Lovers<span>PREMIUM PERFUMES</span></a>
    <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
    <div class="nav-overlay" id="navOverlay"></div>
    <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="womens.html">Women</a></li>
        <li><a href="mens.html">Men</a></li>
        <li><a href="gift-sets.html" class="active">Gift Sets</a></li>
        <li><a href="offers.html">Offers</a></li>
    </ul>
</div></header>
<section class="page-header"><h1>Gift Sets</h1><p style="color:#BBB;"><a href="index.html" style="color:var(--gold);">Home</a> / Gift Sets</p></section>
<div class="container"><section class="section">
    <div class="section-header"><div style="color:var(--gold);font-size:0.75rem;letter-spacing:2px;">PERFECT PRESENTS</div><h2 class="section-title">Luxury <span>Gift Sets</span></h2><div class="section-line"></div><p id="productCount" style="color:#888;margin-top:10px;">Loading...</p></div>
    <div class="product-grid" id="productGrid"></div>
</section></div>
<footer class="footer"><p>&copy; 2026 Scent Lovers Perfume.</p><p style="margin-top:10px;"><i class="fas fa-phone"></i> +251 900 000 000 | <i class="fab fa-telegram"></i> @scentlovers</p></footer>
<script>
const API='https://scent-lovers-api.developeraddis.workers.dev';
async function load(){
    const g=document.getElementById('productGrid'),c=document.getElementById('productCount');
    g.innerHTML='<div style="text-align:center;padding:60px;grid-column:1/-1;">⏳ Loading...</div>';
    try{
        const r=await fetch(`${API}/api/products`),d=await r.json();
        const p=(Array.isArray(d.products)?d.products:[]).filter(x=>x.category==='gift');
        c.textContent=`${p.length} gift sets — perfect for any occasion`;
        if(p.length===0){g.innerHTML='<div style="text-align:center;padding:40px;grid-column:1/-1;color:#888;">No gift sets yet.</div>';return;}
        g.innerHTML=p.map(x=>`<div class="product-card"><div class="product-card-img"><img src="${x.image||'https://via.placeholder.com/400x300'}" alt="${esc(x.name)}" onerror="this.src='https://via.placeholder.com/400x300'" loading="lazy">${x.tag?`<span class="product-card-tag">${esc(x.tag)}</span>`:''}</div><div class="product-card-body"><div class="brand">${esc(x.brand)}</div><h4>${esc(x.name)}</h4><span class="price">${esc(x.price)}</span><button class="order-btn" onclick="order('${esc(x.brand)}','${esc(x.name)}')"><i class="fas fa-shopping-cart"></i> Order Now</button></div></div>`).join('');
    }catch(e){g.innerHTML='<div style="text-align:center;padding:40px;grid-column:1/-1;color:#e74c3c;">Error loading.</div>';}
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function order(b,n){window.open(`https://t.me/scentlovers?text=${encodeURIComponent('Hi! Interested in: '+b+' - '+n)}`,'_blank');}
const btn=document.getElementById('mobileMenuBtn'),nav=document.getElementById('navLinks'),ov=document.getElementById('navOverlay');
if(btn){btn.onclick=()=>{nav.classList.toggle('show');ov.classList.toggle('show');};ov.onclick=()=>{nav.classList.remove('show');ov.classList.remove('show');};}
load();
</script>
</body>
</html>
