<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Scent Lovers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff}
        .topbar{background:#000;text-align:center;padding:10px;font-size:0.75rem;border-bottom:1px solid #222;display:flex;justify-content:center;gap:30px}
        .topbar i{color:#D4A853}
        nav{background:#0a0a0a;padding:15px 30px;border-bottom:2px solid #D4A853;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
        .logo{font-family:'Playfair Display',serif;font-size:1.6rem;color:#D4A853;text-decoration:none;font-weight:700}
        .nav-links{display:flex;gap:25px;list-style:none}
        .nav-links a{color:#bbb;text-decoration:none;font-weight:500;font-size:0.9rem}
        .nav-links a:hover,.nav-links a.active{color:#D4A853}
        .menu-btn{display:none;background:#D4A853;border:none;color:#000;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.2rem}
        .section{padding:40px 20px;max-width:1200px;margin:0 auto}
        .section-title{font-family:'Playfair Display',serif;font-size:2rem;text-align:center}
        .section-title span{color:#D4A853}
        .filters{display:flex;gap:10px;margin:25px 0;flex-wrap:wrap;justify-content:center}
        .filters button{padding:10px 22px;border:1px solid #D4A853;background:transparent;color:#D4A853;border-radius:25px;cursor:pointer;font-weight:600}
        .filters button.active,.filters button:hover{background:#D4A853;color:#000}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:25px}
        .card{background:#111;border-radius:15px;overflow:hidden;border:1px solid #333;transition:0.3s}
        .card:hover{transform:translateY(-5px);border-color:#D4A853}
        .card img{width:100%;height:230px;object-fit:cover}
        .card-body{padding:15px}
        .card-body .brand{color:#D4A853;font-size:0.75rem;text-transform:uppercase}
        .card-body h4{margin:5px 0}
        .card-body .price{color:#D4A853;font-weight:700;font-size:1.1rem;margin:8px 0}
        .card-body .btn-order{width:100%;padding:10px;background:#D4A853;color:#000;border:none;border-radius:25px;font-weight:700;cursor:pointer}
        .tag{position:absolute;top:10px;left:10px;background:#D4A853;color:#000;padding:3px 12px;border-radius:15px;font-size:0.7rem;font-weight:700}
        .img-wrap{position:relative}
        footer{background:#000;text-align:center;padding:30px;border-top:1px solid #222;margin-top:40px;color:#888}
        @media(max-width:768px){.menu-btn{display:flex;align-items:center;justify-content:center}.nav-links{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card img{height:160px}}
    </style>
</head>
<body>
<div class="topbar"><div><i class="fas fa-truck"></i> Free Delivery Over 5,000 ETB</div><div><i class="fas fa-gift"></i> 2 Free Samples</div></div>
<nav>
    <a href="index.html" class="logo">🛍️ Scent Lovers</a>
    <button class="menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('show')">☰</button>
    <ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="products.html" class="active">Products</a></li><li><a href="index.html#reviews">Reviews</a></li><li><a href="index.html#contact">Contact</a></li></ul>
</nav>

<section class="section">
    <h2 class="section-title">Our <span>Products</span></h2>
    <div class="filters">
        <button class="active" onclick="filterProducts('all')">All</button>
        <button onclick="filterProducts('women')">👩 Women</button>
        <button onclick="filterProducts('men')">👨 Men</button>
        <button onclick="filterProducts('gift')">🎁 Gift Sets</button>
        <button onclick="filterProducts('sale')">🔥 Sale</button>
    </div>
    <div class="grid" id="productGrid"><p style="text-align:center;color:#888;grid-column:1/-1;padding:40px">Loading...</p></div>
</section>

<footer><p>© 2026 Scent Lovers. All rights reserved.</p><p style="margin-top:8px;color:#D4A853">@scentlovers</p></footer>

<script>
const API = 'https://scent-lovers-api.developeraddis.workers.dev/api/products';
let products = [], current = 'all';

async function load() {
    const res = await fetch(API); const data = await res.json();
    products = data.products || []; render();
}
function render() {
    let f = current === 'all' ? products : products.filter(p => p.category === current);
    const g = document.getElementById('productGrid');
    if(!f.length) { g.innerHTML = '<p style="text-align:center;color:#888;grid-column:1/-1;padding:40px">No products found</p>'; return; }
    g.innerHTML = f.map(p => `
        <div class="card"><div class="img-wrap"><img src="${p.image||'https://via.placeholder.com/400x250'}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x250'" loading="lazy">${p.tag?`<span class="tag">${p.tag}</span>`:''}</div>
        <div class="card-body"><div class="brand">${p.brand}</div><h4>${p.name}</h4><div class="price">${p.price}</div>
        <button class="btn-order" onclick="order('${p.brand}','${p.name}')">🛒 Order Now</button></div></div>
    `).join('');
}
function filterProducts(c) { current = c; document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); render(); }
function order(b,n) { window.open(`https://t.me/scentlovers?text=${encodeURIComponent('Hi! Interested in: '+b+' - '+n)}`,'_blank'); }
load();
</script>
</body>
</html>
