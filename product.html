<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Products | Scent Lovers</title>
<style>
body{font-family:sans-serif;background:#0a0a0a;color:#fff;margin:0;padding:15px}
h1{color:#D4A853;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;max-width:1000px;margin:20px auto}
.card{background:#111;border-radius:10px;overflow:hidden;border:1px solid #333}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:12px}
.card-body h3{color:#D4A853;font-size:0.9rem;margin:0}
.price{color:#D4A853;font-weight:bold;font-size:1.1rem;margin:5px 0}
button{width:100%;padding:10px;background:#D4A853;color:#000;border:none;border-radius:5px;cursor:pointer;font-weight:bold}
.filters{display:flex;gap:5px;justify-content:center;margin-bottom:15px;flex-wrap:wrap}
.filters button{padding:8px 14px;border:1px solid #D4A853;background:transparent;color:#D4A853;border-radius:15px;cursor:pointer;font-size:0.8rem}
.filters button.active{background:#D4A853;color:#000}
a{color:#D4A853;text-decoration:none}
nav{text-align:center;padding:10px;border-bottom:2px solid #D4A853;margin-bottom:20px}
</style>
</head>
<body>
<nav><a href="index.html" style="font-size:1.2rem;font-weight:bold">Scent Lovers</a></nav>
<h1>Our Products</h1>
<div class="filters">
<button class="active" onclick="filter('all',this)">All</button>
<button onclick="filter('women',this)">Women</button>
<button onclick="filter('men',this)">Men</button>
<button onclick="filter('gift',this)">Gift</button>
<button onclick="filter('sale',this)">Sale</button>
</div>
<div class="grid" id="grid">Loading...</div>
<script>
var prods=[],cat="all";
fetch("https://scent-lovers-api.developeraddis.workers.dev/api/products").then(r=>r.json()).then(d=>{prods=d.products||[];render()});
function filter(c,btn){cat=c;document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render()}
function render(){
var f=cat==="all"?prods:prods.filter(p=>p.category===cat);
var g=document.getElementById("grid");
if(!f.length){g.innerHTML="<p style=text-align:center;color:#888;grid-column:1/-1>No products</p>";return}
g.innerHTML=f.map(p=>'<div class="card"><img src="'+(p.image||"https://via.placeholder.com/400x200")+'" onerror="this.src=\'https://via.placeholder.com/400x200\'"><div class="card-body"><h3>'+p.brand+" - "+p.name+'</h3><div class="price">'+p.price+'</div><button onclick="window.open(\'https://t.me/scentlovers\')">Order Now</button></div></div>').join("")
}
</script>
</body>
</html>
