<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Scent Lovers</title>
    <style>
        body{font-family:sans-serif;background:#0a0a0a;color:#fff;margin:0;padding:0}
        nav{background:#000;padding:15px;text-align:center;border-bottom:2px solid #D4A853}
        nav a{color:#D4A853;text-decoration:none;font-size:1.3rem;font-weight:bold}
        nav p{margin:5px 0 0;font-size:0.8rem;color:#888}
        nav p a{color:#888;font-size:0.8rem;margin:0 10px}
        .header{text-align:center;padding:40px 15px;background:#111}
        .header h1{color:#D4A853;margin:0}
        .container{max-width:1000px;margin:20px auto;padding:0 15px}
        .filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
        .filters button{padding:10px 18px;border:1px solid #D4A853;background:transparent;color:#D4A853;border-radius:20px;cursor:pointer;font-weight:bold;font-size:0.85rem}
        .filters button.active,.filters button:hover{background:#D4A853;color:#000}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
        .card{background:#111;border-radius:12px;overflow:hidden;border:1px solid #333}
        .card img{width:100%;height:200px;object-fit:cover;display:block}
        .card-body{padding:15px}
        .card-body .brand{color:#D4A853;font-size:0.7rem;text-transform:uppercase}
        .card-body h3{margin:5px 0;font-size:0.95rem;color:#fff}
        .price{color:#D4A853;font-weight:bold;font-size:1.2rem;margin:8px 0}
        .btn-order{width:100%;padding:12px;background:#D4A853;color:#000;border:none;border-radius:25px;cursor:pointer;font-weight:bold;font-size:0.9rem}
        .tag{display:inline-block;background:#D4A853;color:#000;padding:2px 10px;border-radius:10px;font-size:0.7rem;margin-bottom:5px}
        .empty{text-align:center;padding:50px;color:#888;grid-column:1/-1}
        footer{text-align:center;padding:20px;color:#888;font-size:0.8rem;border-top:1px solid #222;margin-top:30px}
    </style>
</head>
<body>

<nav>
    <a href="index.html">Scent Lovers</a>
    <p>
        <a href="index.html">Home</a> |
        <a href="products.html" style="color:#D4A853">Products</a>
    </p>
</nav>

<div class="header">
    <h1>Our Products</h1>
</div>

<div class="container">
    <div class="filters">
        <button class="active" onclick="filterProducts('all',this)">All</button>
        <button onclick="filterProducts('women',this)">Women</button>
        <button onclick="filterProducts('men',this)">Men</button>
        <button onclick="filterProducts('gift',this)">Gift</button>
        <button onclick="filterProducts('sale',this)">Sale</button>
    </div>
    <div class="grid" id="productGrid">
        <div class="empty">Loading products...</div>
    </div>
</div>

<footer>© 2026 Scent Lovers | @scentlovers</footer>

<script>
var API_URL = 'https://scent-lovers-api.developeraddis.workers.dev/api/products';
var allProducts = [];
var currentCategory = 'all';

fetch(API_URL)
  .then(function(response) { return response.json(); })
  .then(function(data) {
    allProducts = data.products || [];
    showProducts();
  })
  .catch(function() {
    document.getElementById('productGrid').innerHTML = '<div class="empty">Error loading products. Please try again.</div>';
  });

function filterProducts(category, button) {
    currentCategory = category;
    var buttons = document.querySelectorAll('.filters button');
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove('active');
    }
    button.classList.add('active');
    showProducts();
}

function showProducts() {
    var filtered = allProducts;
    if (currentCategory !== 'all') {
        filtered = allProducts.filter(function(p) {
            return p.category === currentCategory;
        });
    }
    
    var grid = document.getElementById('productGrid');
    
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">No products found in this category.</div>';
        return;
    }
    
    var html = '';
    for (var i = 0; i < filtered.length; i++) {
        var p = filtered[i];
        var image = p.image || 'https://via.placeholder.com/400x250';
        var tag = p.tag ? '<span class="tag">' + p.tag + '</span>' : '';
        
        html += '<div class="card">';
        html += '<img src="' + image + '" alt="' + p.name + '" onerror="this.src=\'https://via.placeholder.com/400x250\'">';
        html += '<div class="card-body">';
        html += '<div class="brand">' + p.brand + '</div>';
        html += tag;
        html += '<h3>' + p.name + '</h3>';
        html += '<div class="price">' + p.price + '</div>';
        html += '<button class="btn-order" onclick="orderNow(\'' + p.brand + '\',\'' + p.name + '\')">Order Now</button>';
        html += '</div></div>';
    }
    
    grid.innerHTML = html;
}

function orderNow(brand, name) {
    var message = 'Hi! I am interested in: ' + brand + ' - ' + name;
    window.open('https://t.me/scentlovers?text=' + encodeURIComponent(message), '_blank');
}
</script>
</body>
</html>
