<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scent Lovers | Premium Perfumes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff}
        .topbar{background:#000;text-align:center;padding:10px;font-size:0.75rem;border-bottom:1px solid #222;display:flex;justify-content:center;gap:30px}
        .topbar span{color:#D4A853}
        .nav{background:#0a0a0a;padding:15px 20px;border-bottom:2px solid #D4A853;position:sticky;top:0;z-index:100;text-align:center}
        .nav h1{font-family:'Playfair Display',serif;color:#D4A853;font-size:1.8rem}
        .hero{text-align:center;padding:60px 20px;background:linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.4)),url('https://images.unsplash.com/photo-1541643600914-78b084683601?w=1600') center/cover}
        .hero h2{font-family:'Playfair Display',serif;color:#D4A853;font-size:2rem}
        .hero p{color:#bbb;margin-top:10px}
        .container{max-width:1100px;margin:0 auto;padding:20px}
        .filters{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap;justify-content:center}
        .filters button{padding:10px 22px;border:1px solid #D4A853;background:transparent;color:#D4A853;border-radius:25px;cursor:pointer;font-weight:600;font-size:0.9rem}
        .filters button.active,.filters button:hover{background:#D4A853;color:#000}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:25px}
        .card{background:#111;border-radius:15px;overflow:hidden;border:1px solid #333;transition:.3s}
        .card:hover{transform:translateY(-5px);border-color:#D4A853}
        .img-wrap{position:relative}
        .img-wrap img{width:100%;height:230px;object-fit:cover}
        .tag{position:absolute;top:10px;left:10px;background:#D4A853;color:#000;padding:3px 12px;border-radius:15px;font-size:0.7rem;font-weight:700}
        .card-body{padding:15px}
        .card-body .brand{color:#D4A853;font-size:0.75rem;text-transform:uppercase;margin-bottom:3px}
        .card-body h3{font-size:1rem;margin-bottom:8px}
        .card-body .price{color:#D4A853;font-weight:700;font-size:1.2rem;margin-bottom:10px}
        .btn-order{width:100%;padding:12px;background:#D4A853;color:#000;border:none;border-radius:25px;font-weight:700;cursor:pointer;font-size:0.9rem}
        .btn-order:hover{background:#b8933f}
        .footer{text-align:center;padding:30px;color:#888;border-top:1px solid #222;margin-top:40px;font-size:0.9rem}
        .empty{text-align:center;padding:60px;color:#888;grid-column:1/-1}
        @media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card img{height:160px}.hero h2{font-size:1.5rem}}
    </style>
</head>
<body>

<div class="topbar">
    <div>🚚 Free Delivery Over <span>5,000 ETB</span></div>
    <div>🎁 <span>2 Free Samples</span> With Every Order</div>
</div>

<div class="nav">
    <h1>🛍️ Scent Lovers</h1>
    <p style="color:#888;font-size:0.8rem">Premium Fragrances</p>
</div>

<div class="hero">
    <h2>Discover Your Signature Scent</h2>
    <p>Luxury perfumes delivered to your doorstep</p>
</div>

<div class="container">
    <div class="filters">
        <button class="active" onclick="filter('all')">All</button>
        <button onclick="filter('women')">👩 Women</button>
        <button onclick="filter('men')">👨 Men</button>
        <button onclick="filter('gift')">🎁 Gift Sets</button>
        <button onclick="filter('sale')">🔥 Sale</button>
    </div>
    
    <div class="grid" id="grid">
        <div class="empty">Loading products...</div>
    </div>
</div>

<div class="footer">
    <p>© 2026 Scent Lovers Perfume</p>
    <p style="margin-top:8px">Order via Telegram: <span style="color:#D4A853">@scentlovers</span></p>
    <p>📞 +251 900 000 000</p>
</div>

<script>
const API = 'https://scent-lovers-api.developeraddis.workers.dev/api/products';
let products = [];
let currentFilter = 'all';

async function loadProducts() {
    try {
        const res = await fetch(API);
        const data = await res.json();
        products = data.products || [];
        render();
    } catch(e) {
        document.getElementById('grid').innerHTML = '<div class="empty" style="color:#e74c3c">Error loading products. Please refresh.</div>';
    }
}

function render() {
    const filtered = currentFilter === 'all' ? products : products.filter(p => p.category === currentFilter);
    const grid = document.getElementById('grid');
    
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">No products found in this category</div>';
        return;
    }
    
    grid.innerHTML = filtered.map(p => `
        <div class="card">
            <div class="img-wrap">
                <img src="${p.image || 'https://via.placeholder.com/400x250'}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x250'" loading="lazy">
                ${p.tag ? `<span class="tag">${p.tag}</span>` : ''}
            </div>
            <div class="card-body">
                <div class="brand">${p.brand}</div>
                <h3>${p.name}</h3>
                <div class="price">${p.price}</div>
                <button class="btn-order" onclick="order('${p.brand.replace(/'/g,"\\'")}','${p.name.replace(/'/g,"\\'")}')">🛒 Order Now</button>
            </div>
        </div>
    `).join('');
}

function filter(cat) {
    currentFilter = cat;
    document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    render();
}

function order(brand, name) {
    const msg = `Hi! I'm interested in: ${brand} - ${name}`;
    window.open(`https://t.me/scentlovers?text=${encodeURIComponent(msg)}`, '_blank');
}

loadProducts();
</script>
</body>
</html>
