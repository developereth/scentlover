<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager | Scent Lovers</title>
    <style>
        :root { --gold: #D4A853; }
        body { font-family: 'Segoe UI', sans-serif; background: #0A0A0A; padding: 20px; color: white; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; }
        .panel { background: #111; padding: 30px; border-radius: 15px; margin-bottom: 30px; border: 1px solid rgba(212,168,83,0.2); }
        h2 { border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 20px; color: var(--gold); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #bbb; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; color: white; box-sizing: border-box; }
        .upload-area { border: 2px dashed var(--gold); border-radius: 10px; padding: 30px; text-align: center; cursor: pointer; background: #1a1a1a; }
        .preview-img { max-width: 200px; margin-top: 15px; display: none; border-radius: 8px; }
        .preview-img.show { display: block; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 3px; }
        .btn-primary { background: var(--gold); color: black; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-edit { background: #3498db; color: white; }
        .btn-save { background: #27ae60; color: white; }
        .btn-cancel { background: #95a5a6; color: white; }
        .product-item { background: #1a1a1a; padding: 15px; margin: 15px 0; border-radius: 10px; display: flex; gap: 15px; align-items: flex-start; border: 1px solid #333; }
        .product-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .item-info { flex: 1; }
        .item-info h3 { color: var(--gold); margin: 0 0 5px; }
        .item-price { color: var(--gold); font-weight: bold; }
        .edit-fields { display: none; margin-top: 15px; }
        .editing .edit-fields { display: block; }
        .editing .view-fields { display: none; }
        .status { padding: 12px; margin: 15px 0; border-radius: 8px; display: none; }
        .status.success { background: #27ae60; color: white; display: block; }
        .status.error { background: #c0392b; color: white; display: block; }
        .hidden { display: none !important; }
        .cat-btn { background: #333; padding: 8px 16px; border-radius: 25px; cursor: pointer; display: inline-block; margin: 5px; border: none; color: white; }
        .cat-btn.active { background: var(--gold); color: black; }
        .search-box input { width: 100%; padding: 12px; border: 2px solid var(--gold); border-radius: 25px; margin-bottom: 20px; box-sizing: border-box; background: #1a1a1a; color: white; }
        .product-count { color: #888; font-size: 0.9rem; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="container">
    <div class="panel" id="loginPanel">
        <h2>🔐 Admin Login</h2>
        <input type="password" id="password" placeholder="Enter admin password" style="margin-bottom:10px;">
        <button class="btn-primary" onclick="login()">Access Product Manager</button>
        <div id="loginStatus" class="status"></div>
    </div>
    
    <div class="panel hidden" id="adminPanel">
        <h2>➕ Add New Product</h2>
        
        <div class="form-group">
            <label>📸 Product Image</label>
            <div class="upload-area" onclick="document.getElementById('imageInput').click()">
                <div style="font-size:40px;">📷</div>
                <div>Click to upload product photo</div>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImage(event)">
            <img id="preview" class="preview-img" alt="Preview">
            <div id="uploadStatus" style="font-size:0.8rem; margin-top:5px;"></div>
        </div>
        
        <div class="form-group"><label>📝 Product Name</label><input type="text" id="productName" placeholder="e.g., Rose Elegance"></div>
        <div class="form-group"><label>🏷️ Brand</label><input type="text" id="productBrand" placeholder="e.g., Chanel"></div>
        <div class="form-group"><label>💰 Price (ETB)</label><input type="number" id="productPrice" placeholder="0.00" step="0.01"></div>
        <div class="form-group"><label>📂 Category</label>
            <select id="productCategory">
                <option value="women">👩 Women's Perfumes</option>
                <option value="men">👨 Men's Colognes</option>
                <option value="gift">🎁 Gift Sets</option>
                <option value="sale">🔥 Sale / Offers</option>
            </select>
        </div>
        <div class="form-group"><label>📋 Description</label><textarea id="productDesc" rows="2"></textarea></div>
        <div class="form-group"><label>🏷️ Tag (Bestseller, New, Sale)</label><input type="text" id="productTag"></div>
        <button class="btn-primary" onclick="addProduct()">✅ Add Product</button>
        <div id="statusMsg" class="status"></div>
        
        <h2 style="margin-top:40px;">📋 All Products</h2>
        <div class="search-box"><input type="text" id="searchInput" placeholder="🔍 Search products..." oninput="renderProducts()"></div>
        <div id="categoryFilter"></div>
        <div class="product-count" id="productCount"></div>
        <div id="productsList"></div>
        <div id="noResults" class="hidden" style="text-align:center; padding:30px; color:#999;">No products found</div>
    </div>
</div>

<script>
    const API_URL = 'https://scent-lovers-api.developeraddis.workers.dev';
    const CLOUD_NAME = 'dm6rwo1ox';
    const UPLOAD_PRESET = 'scent_lovers_preset';
    const ADMIN_PASS = 'ScentLovers2026';
    
    let authToken = null;
    let allProducts = [];
    let currentFilter = 'all';
    let newImageUrl = '';
    let editImageUrls = {};
    
    // ============ LOGIN ============
    async function login() {
        const pass = document.getElementById('password').value;
        if (pass !== ADMIN_PASS) { 
            document.getElementById('loginStatus').textContent = '❌ Wrong password';
            document.getElementById('loginStatus').className = 'status error';
            return; 
        }
        authToken = btoa(`scentlovers:${pass}`);
        document.getElementById('loginPanel').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        await loadProducts();
    }
    
    // ============ LOAD PRODUCTS ============
    async function loadProducts() {
        try {
            const res = await fetch(`${API_URL}/api/products`);
            const data = await res.json();
            console.log('API Response:', data);
            
            if (data.success) {
                // Products should already be an array from the fixed Worker
                allProducts = Array.isArray(data.products) ? data.products : [];
                console.log('Loaded products:', allProducts.length);
                renderProducts();
                renderCategoryFilter();
            } else {
                console.error('API returned error:', data);
                showStatus('❌ Error loading products', 'error');
            }
        } catch(e) { 
            console.error('Load error:', e); 
            showStatus('❌ Connection error', 'error'); 
        }
    }
    
    // ============ RENDER PRODUCTS ============
    function renderProducts() {
        let filtered = [...allProducts];
        
        // Category filter
        if (currentFilter !== 'all') {
            filtered = filtered.filter(p => p.category === currentFilter);
        }
        
        // Search filter
        const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
        if (search) {
            filtered = filtered.filter(p => 
                (p.name && p.name.toLowerCase().includes(search)) || 
                (p.brand && p.brand.toLowerCase().includes(search))
            );
        }
        
        const container = document.getElementById('productsList');
        const noResults = document.getElementById('noResults');
        const countEl = document.getElementById('productCount');
        
        countEl.textContent = `Showing ${filtered.length} of ${allProducts.length} products`;
        
        if (filtered.length === 0) {
            container.innerHTML = '';
            noResults.classList.remove('hidden');
            return;
        }
        noResults.classList.add('hidden');
        
        container.innerHTML = filtered.map(p => `
            <div class="product-item" id="product-${p.id}">
                <img src="${p.image || 'https://via.placeholder.com/80x80?text=No+Image'}" alt="${escapeHtml(p.name)}" onerror="this.src='https://via.placeholder.com/80x80'">
                <div class="item-info">
                    <div class="view-fields">
                        <h3>${escapeHtml(p.brand || '')} - ${escapeHtml(p.name || '')}</h3>
                        <span class="item-price">${p.price || ''}</span>
                        <div style="font-size:0.8rem; color:#888;">Category: ${p.category || 'N/A'} ${p.tag ? '| Tag: ' + p.tag : ''}</div>
                    </div>
                    <div class="edit-fields">
                        <label>New Image (optional)</label>
                        <input type="file" id="editFile-${p.id}" accept="image/*" onchange="handleEditImage(event, '${p.id}')">
                        <div id="editStatus-${p.id}" style="font-size:0.7rem;"></div>
                        <label>Name</label><input type="text" id="editName-${p.id}" value="${escapeHtml(p.name || '')}">
                        <label>Brand</label><input type="text" id="editBrand-${p.id}" value="${escapeHtml(p.brand || '')}">
                        <label>Price</label><input type="text" id="editPrice-${p.id}" value="${(p.price || '').replace(' ETB', '')}">
                        <label>Category</label>
                        <select id="editCat-${p.id}">
                            <option value="women" ${p.category==='women'?'selected':''}>Women</option>
                            <option value="men" ${p.category==='men'?'selected':''}>Men</option>
                            <option value="gift" ${p.category==='gift'?'selected':''}>Gift Sets</option>
                            <option value="sale" ${p.category==='sale'?'selected':''}>Sale/Offers</option>
                        </select>
                        <label>Description</label><textarea id="editDesc-${p.id}" rows="2">${escapeHtml(p.description || '')}</textarea>
                        <label>Tag</label><input type="text" id="editTag-${p.id}" value="${escapeHtml(p.tag || '')}">
                        <input type="hidden" id="editImage-${p.id}" value="${p.image || ''}">
                    </div>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <button class="btn-edit" id="editBtn-${p.id}" onclick="startEdit('${p.id}')">✏️ Edit</button>
                    <button class="btn-save hidden" id="saveBtn-${p.id}" onclick="saveEdit('${p.id}')">💾 Save</button>
                    <button class="btn-cancel hidden" id="cancelBtn-${p.id}" onclick="cancelEdit('${p.id}')">Cancel</button>
                    <button class="btn-danger" onclick="deleteProduct('${p.id}')">🗑️ Delete</button>
                </div>
            </div>
        `).join('');
    }
    
    function escapeHtml(str) { 
        if (!str) return ''; 
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    
    function renderCategoryFilter() {
        const cats = ['all', 'women', 'men', 'gift', 'sale'];
        const names = { all:'All', women:'👩 Women', men:'👨 Men', gift:'🎁 Gift', sale:'🔥 Sale' };
        document.getElementById('categoryFilter').innerHTML = cats.map(c => 
            `<button class="cat-btn ${currentFilter===c?'active':''}" onclick="setFilter('${c}')">${names[c]}</button>`
        ).join('');
    }
    
    function setFilter(cat) { 
        currentFilter = cat; 
        renderProducts(); 
    }
    
    // ============ IMAGE UPLOAD ============
    async function handleImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        // Show preview
        const reader = new FileReader();
        reader.onload = ev => { 
            document.getElementById('preview').src = ev.target.result; 
            document.getElementById('preview').classList.add('show'); 
        };
        reader.readAsDataURL(file);
        
        // Upload to Cloudinary
        document.getElementById('uploadStatus').textContent = '⏳ Uploading...';
        const fd = new FormData();
        fd.append('file', file);
        fd.append('upload_preset', UPLOAD_PRESET);
        
        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { 
                method: 'POST', 
                body: fd 
            });
            const data = await res.json();
            if (data.secure_url) {
                newImageUrl = data.secure_url;
                document.getElementById('uploadStatus').textContent = '✅ Image ready!';
                document.getElementById('uploadStatus').style.color = '#27ae60';
            } else { 
                document.getElementById('uploadStatus').textContent = '❌ Upload failed'; 
                document.getElementById('uploadStatus').style.color = '#c0392b';
            }
        } catch(e) { 
            document.getElementById('uploadStatus').textContent = '❌ Upload error'; 
            document.getElementById('uploadStatus').style.color = '#c0392b';
        }
    }
    
    async function handleEditImage(event, id) {
        const file = event.target.files[0];
        if (!file) return;
        
        document.getElementById('editStatus-' + id).textContent = '⏳ Uploading...';
        const fd = new FormData();
        fd.append('file', file);
        fd.append('upload_preset', UPLOAD_PRESET);
        
        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { 
                method: 'POST', 
                body: fd 
            });
            const data = await res.json();
            if (data.secure_url) {
                editImageUrls[id] = data.secure_url;
                document.getElementById('editImage-' + id).value = data.secure_url;
                document.getElementById('editStatus-' + id).textContent = '✅ New image ready!';
                document.getElementById('editStatus-' + id).style.color = '#27ae60';
            } else { 
                document.getElementById('editStatus-' + id).textContent = '❌ Failed'; 
            }
        } catch(e) { 
            document.getElementById('editStatus-' + id).textContent = '❌ Error'; 
        }
    }
    
    // ============ ADD PRODUCT ============
    async function addProduct() {
        const name = document.getElementById('productName').value.trim();
        const brand = document.getElementById('productBrand').value.trim();
        const price = document.getElementById('productPrice').value.trim();
        
        if (!name || !brand || !price) { 
            showStatus('❌ Name, brand and price are required', 'error'); 
            return; 
        }
        if (!newImageUrl) { 
            showStatus('❌ Please upload an image first', 'error'); 
            return; 
        }
        
        const product = {
            name,
            brand,
            price: price + ' ETB',
            category: document.getElementById('productCategory').value,
            description: document.getElementById('productDesc').value.trim(),
            image: newImageUrl,
            tag: document.getElementById('productTag').value.trim()
        };
        
        try {
            const res = await fetch(`${API_URL}/api/admin/products`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'X-Admin-Auth': authToken 
                },
                body: JSON.stringify(product)
            });
            const data = await res.json();
            
            if (data.success) {
                showStatus('✅ Product added successfully!', 'success');
                // Clear form
                ['productName', 'productBrand', 'productPrice', 'productDesc', 'productTag'].forEach(id => {
                    document.getElementById(id).value = '';
                });
                document.getElementById('preview').classList.remove('show');
                newImageUrl = '';
                document.getElementById('imageInput').value = '';
                document.getElementById('uploadStatus').textContent = '';
                await loadProducts();
            } else { 
                showStatus('❌ Failed: ' + (data.error || 'Unknown error'), 'error'); 
            }
        } catch(e) { 
            showStatus('❌ Connection error: ' + e.message, 'error'); 
        }
    }
    
    // ============ EDIT PRODUCT ============
    function startEdit(id) {
        const item = document.getElementById(`product-${id}`);
        if (item) item.classList.add('editing');
        document.getElementById(`editBtn-${id}`).classList.add('hidden');
        document.getElementById(`saveBtn-${id}`).classList.remove('hidden');
        document.getElementById(`cancelBtn-${id}`).classList.remove('hidden');
    }
    
    function cancelEdit(id) {
        const item = document.getElementById(`product-${id}`);
        if (item) item.classList.remove('editing');
        document.getElementById(`editBtn-${id}`).classList.remove('hidden');
        document.getElementById(`saveBtn-${id}`).classList.add('hidden');
        document.getElementById(`cancelBtn-${id}`).classList.add('hidden');
        delete editImageUrls[id];
        loadProducts(); // Reload to reset fields
    }
    
    async function saveEdit(id) {
        const name = document.getElementById(`editName-${id}`).value.trim();
        const brand = document.getElementById(`editBrand-${id}`).value.trim();
        const price = document.getElementById(`editPrice-${id}`).value.trim();
        const category = document.getElementById(`editCat-${id}`).value;
        const description = document.getElementById(`editDesc-${id}`).value.trim();
        const tag = document.getElementById(`editTag-${id}`).value.trim();
        const image = editImageUrls[id] || document.getElementById(`editImage-${id}`).value;
        
        if (!name || !brand || !price) { 
            showStatus('❌ Name, brand and price required', 'error'); 
            return; 
        }
        
        const updatedProduct = {
            name,
            brand,
            price: price.includes('ETB') ? price : price + ' ETB',
            category,
            description,
            image,
            tag
        };
        
        try {
            const res = await fetch(`${API_URL}/api/admin/products/${id}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json', 
                    'X-Admin-Auth': authToken 
                },
                body: JSON.stringify(updatedProduct)
            });
            const data = await res.json();
            
            if (data.success) {
                showStatus('✅ Product updated!', 'success');
                delete editImageUrls[id];
                await loadProducts();
            } else { 
                showStatus('❌ Update failed: ' + (data.error || ''), 'error'); 
            }
        } catch(e) { 
            showStatus('❌ Error: ' + e.message, 'error'); 
        }
    }
    
    // ============ DELETE PRODUCT ============
    async function deleteProduct(id) {
        if (!confirm('Are you sure you want to delete this product permanently?')) return;
        
        try {
            const res = await fetch(`${API_URL}/api/admin/products/${id}`, { 
                method: 'DELETE', 
                headers: { 'X-Admin-Auth': authToken } 
            });
            const data = await res.json();
            
            if (data.success) {
                showStatus('✅ Product deleted', 'success');
                await loadProducts();
            } else {
                showStatus('❌ Delete failed: ' + (data.error || ''), 'error');
            }
        } catch(e) { 
            showStatus('❌ Error: ' + e.message, 'error'); 
        }
    }
    
    function showStatus(msg, type) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = `status ${type}`;
        setTimeout(() => { el.className = 'status'; }, 3000);
    }
</script>
</body>
</html>
