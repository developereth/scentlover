<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Diagnostic Test</title>
    <style>
        body { font-family: monospace; background: #0a0a0a; color: #00ff00; padding: 20px; max-width: 900px; margin: 0 auto; }
        .test { background: #111; padding: 20px; margin: 15px 0; border-radius: 8px; border-left: 4px solid #333; }
        .test.pass { border-left-color: #00ff00; }
        .test.fail { border-left-color: #ff0000; }
        .test.running { border-left-color: #ffff00; }
        h2 { color: #D4A853; }
        pre { background: #000; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; }
        button { background: #D4A853; color: black; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 10px 5px; font-size: 1rem; }
        button:hover { background: #c49540; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .dot-pass { background: #00ff00; }
        .dot-fail { background: #ff0000; }
        .dot-running { background: #ffff00; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <h1>🔧 Scent Lovers API Diagnostic</h1>
    <p>This will test all connections and identify the problem.</p>
    
    <button onclick="runAllTests()">▶️ Run All Tests</button>
    <button onclick="clearResults()">🗑️ Clear Results</button>
    <button onclick="addTestProduct()">🧪 Add Test Product</button>
    
    <div id="results"></div>

    <script>
        const API_URL = 'https://scent-lovers-api.developeraddis.workers.dev';
        const UPSTASH_URL = 'https://prime-urchin-106067.upstash.io';
        const UPSTASH_TOKEN = 'gQAAAAAAAZ5TAAIgcDI4MDU2MTg3NGM1MzY0YWVkOWVkZmUzNjk0Y2ViZDdlMQ';
        const ADMIN_PASS = 'ScentLovers2026';
        
        let authToken = btoa(`scentlovers:${ADMIN_PASS}`);
        let resultsDiv = document.getElementById('results');
        
        function log(message, type = 'info') {
            const colors = {
                info: '#00ff00',
                error: '#ff4444',
                warn: '#ffaa00',
                success: '#00cc44'
            };
            const result = document.createElement('div');
            result.style.color = colors[type] || '#fff';
            result.style.margin = '5px 0';
            result.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            resultsDiv.appendChild(result);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        function addTestBlock(title) {
            const block = document.createElement('div');
            block.className = 'test running';
            block.innerHTML = `
                <h3><span class="status-dot dot-running"></span> ${title}</h3>
                <div class="content">Running...</div>
            `;
            resultsDiv.appendChild(block);
            return block;
        }
        
        function updateTestBlock(block, success, message) {
            block.className = `test ${success ? 'pass' : 'fail'}`;
            const dot = block.querySelector('.status-dot');
            dot.className = `status-dot ${success ? 'dot-pass' : 'dot-fail'}`;
            block.querySelector('.content').innerHTML = message;
        }
        
        function clearResults() {
            resultsDiv.innerHTML = '';
        }
        
        async function runAllTests() {
            clearResults();
            log('🚀 Starting diagnostic tests...', 'info');
            
            // Test 1: Worker is reachable
            const test1 = addTestBlock('Test 1: Worker API Reachable');
            try {
                const res = await fetch(`${API_URL}/api/products`);
                const data = await res.json();
                updateTestBlock(test1, true, `
                    ✅ Worker is reachable<br>
                    Status: ${res.status}<br>
                    Response: <pre>${JSON.stringify(data, null, 2)}</pre>
                `);
            } catch(e) {
                updateTestBlock(test1, false, `❌ Worker unreachable: ${e.message}`);
            }
            
            // Test 2: Upstash direct access (ping)
            const test2 = addTestBlock('Test 2: Upstash Database Connection');
            try {
                const res = await fetch(`${UPSTASH_URL}/ping`, {
                    headers: { 'Authorization': `Bearer ${UPSTASH_TOKEN}` }
                });
                const text = await res.text();
                updateTestBlock(test2, res.ok, `
                    Status: ${res.status}<br>
                    Response: ${text}<br>
                    ${res.ok ? '✅ Database is online' : '❌ Database connection failed'}
                `);
            } catch(e) {
                updateTestBlock(test2, false, `❌ Cannot reach Upstash: ${e.message}`);
            }
            
            // Test 3: Get products directly from Upstash
            const test3 = addTestBlock('Test 3: Read Products from Upstash Directly');
            try {
                const res = await fetch(`${UPSTASH_URL}/get/products`, {
                    headers: { 'Authorization': `Bearer ${UPSTASH_TOKEN}` }
                });
                const data = await res.json();
                const result = data.result;
                let parsed = null;
                if (result) {
                    try {
                        parsed = JSON.parse(result);
                    } catch(e) {
                        parsed = `NOT JSON: ${result}`;
                    }
                }
                updateTestBlock(test3, true, `
                    ✅ Read successful<br>
                    Raw result type: ${typeof result}<br>
                    Parsed: <pre>${JSON.stringify(parsed, null, 2)}</pre>
                `);
            } catch(e) {
                updateTestBlock(test3, false, `❌ Read failed: ${e.message}`);
            }
            
            // Test 4: Write test to Upstash directly
            const test4 = addTestBlock('Test 4: Write to Upstash Directly');
            try {
                const testData = JSON.stringify([{ test: true, timestamp: Date.now() }]);
                const res = await fetch(`${UPSTASH_URL}/set/test_write`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${UPSTASH_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });
                const data = await res.json();
                updateTestBlock(test4, data.result === 'OK', `
                    ${data.result === 'OK' ? '✅ Write successful' : '❌ Write failed'}<br>
                    Response: <pre>${JSON.stringify(data, null, 2)}</pre>
                `);
            } catch(e) {
                updateTestBlock(test4, false, `❌ Write failed: ${e.message}`);
            }
            
            // Test 5: Admin login
            const test5 = addTestBlock('Test 5: Admin Login');
            try {
                const res = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'scentlovers', password: ADMIN_PASS })
                });
                const data = await res.json();
                updateTestBlock(test5, data.success, `
                    ${data.success ? '✅ Login successful' : '❌ Login failed'}<br>
                    Response: <pre>${JSON.stringify(data, null, 2)}</pre>
                `);
            } catch(e) {
                updateTestBlock(test5, false, `❌ Login error: ${e.message}`);
            }
            
            // Test 6: Add product via Worker
            const test6 = addTestBlock('Test 6: Add Product via Worker');
            try {
                const testProduct = {
                    name: 'Test Perfume',
                    brand: 'Test Brand',
                    price: '999 ETB',
                    category: 'women',
                    image: 'https://via.placeholder.com/400x300?text=Test',
                    description: 'Diagnostic test product',
                    tag: 'Test'
                };
                const res = await fetch(`${API_URL}/api/admin/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Auth': authToken
                    },
                    body: JSON.stringify(testProduct)
                });
                const data = await res.json();
                updateTestBlock(test6, data.success, `
                    ${data.success ? '✅ Product added successfully!' : '❌ Failed to add product'}<br>
                    Response: <pre>${JSON.stringify(data, null, 2)}</pre>
                `);
                
                if (data.success) {
                    log('✅ Test product added! Check /api/products to verify', 'success');
                }
            } catch(e) {
                updateTestBlock(test6, false, `❌ Add product error: ${e.message}`);
            }
            
            log('🏁 All tests completed!', 'info');
        }
        
        async function addTestProduct() {
            clearResults();
            log('🧪 Adding test product directly via Worker...', 'info');
            
            const testProduct = {
                name: 'Rose Test ' + Date.now().toString().slice(-4),
                brand: 'Test Brand',
                price: '999 ETB',
                category: 'women',
                image: 'https://images.unsplash.com/photo-1541643600914-78b084683601?w=400&q=80',
                description: 'This is a test product to verify the database connection',
                tag: 'New'
            };
            
            try {
                const res = await fetch(`${API_URL}/api/admin/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Auth': authToken
                    },
                    body: JSON.stringify(testProduct)
                });
                const data = await res.json();
                
                log('Response: ' + JSON.stringify(data, null, 2), data.success ? 'success' : 'error');
                
                if (data.success) {
                    log('✅ SUCCESS! Product was saved to database!', 'success');
                    log('📋 Verify at: ' + API_URL + '/api/products', 'info');
                } else {
                    log('❌ FAILED: ' + (data.error || 'Unknown error'), 'error');
                    log('🔍 The issue is in the Worker code or Upstash connection', 'warn');
                }
            } catch(e) {
                log('❌ ERROR: ' + e.message, 'error');
            }
        }
        
        // Auto-run on load
        window.onload = () => {
            log('📋 Diagnostic page ready. Click "Run All Tests" to begin.', 'info');
            log('🔑 Admin token generated automatically', 'info');
        };
    </script>
</body>
</html>
