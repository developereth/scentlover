<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Scent Lovers</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;padding:20px}
        .container{max-width:900px;margin:0 auto}
        .login-box{background:#111;padding:40px;border-radius:15px;max-width:400px;margin:100px auto;text-align:center;border:1px solid #333}
        .login-box h2{color:#D4A853;margin-bottom:20px}
        .login-box input{width:100%;padding:14px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:1rem;text-align:center;margin-bottom:15px}
        .hidden{display:none!important}
        h1{color:#D4A853;margin-bottom:20px;font-size:1.8rem;text-align:center}
        .tabs{display:flex;gap:5px;margin-bottom:25px;justify-content:center}
        .tabs button{padding:10px 20px;border:1px solid #D4A853;background:transparent;color:#D4A853;border-radius:8px;cursor:pointer;font-weight:600}
        .tabs button.active{background:#D4A853;color:#000}
        .tab-content{display:none}.tab-content.show{display:block}
        .card{background:#111;padding:25px;border-radius:12px;margin-bottom:25px;border:1px solid #333}
        h2{color:#D4A853;margin-bottom:15px}
        .row{display:flex;gap:12px;margin-bottom:12px}.row>*{flex:1}
        input,select,textarea{width:100%;padding:12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:0.95rem;margin-bottom:12px;font-family:inherit}
        button{padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
        .btn-gold{background:#D4A853;color:#000}.btn-red{background:#c0392b;color:#fff}.btn-blue{background:#3498db;color:#fff}.btn-green{background:#27ae60;color:#fff}
        .upload-box{border:2px dashed #D4A853;padding:25px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:12px}
        #preview{max-width:200px;display:none;margin:10px auto;border-radius:8px}
        .msg{padding:12px;margin:10px 0;border-radius:8px;display:none;text-align:center;font-weight:600}
        .msg.success{background:#27ae60;display:block}.msg.error{background:#c0392b;display:block}
        .item-row{display:flex;align-items:center;gap:15px;padding:12px;background:#1a1a1a;border-radius:8px;margin-bottom:8px;border:1px solid #333}
        .item-row img{width:50px;height:50px;object-fit:cover;border-radius:6px}
        .item-row .info{flex:1}.item-row .info h3{color:#D4A853;font-size:0.9rem}.item-row .info p{color:#888;font-size:0.75rem}
        .search-box{width:100%;padding:12px;background:#1a1a1a;border:2px solid #D4A853;border-radius:25px;color:#fff;margin-bottom:15px}
        @media(max-width:600px){.row{flex-direction:column}}
    </style>
</head>
<body>
<div class="container">
    <div id="loginScreen" class="login-box"><h2>Admin Login</h2><input type="password" id="pw" placeholder="Password" onkeypress="if(event.key==='Enter')login()"><button class="btn-gold" onclick="login()">Access</button><p id="loginErr" style="color:#e74c3c;margin-top:10px;display:none">Wrong password</p></div>
    
    <div id="panel" class="hidden">
        <h1>Scent Lovers Admin</h1>
        
        <div class="tabs">
            <button class="active" onclick="switchTab('products')">🛍️ Products</button>
            <button onclick="switchTab('blog')">📝 Blog</button>
        </div>
        
        <!-- PRODUCTS TAB -->
        <div class="tab-content show" id="tab-products">
            <div class="card">
                <h2>Add Product</h2>
                <div class="upload-box" onclick="document.getElementById('fileInput').click()"><div style="font-size:40px">📷</div><div>Click to Upload Image</div></div>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadNew()">
                <img id="preview"><div id="upStatus"></div><input type="hidden" id="imgUrl">
                <div class="row"><input type="text" id="name" placeholder="Name *"><input type="text" id="brand" placeholder="Brand *"></div>
                <div class="row"><input type="text" id="price" placeholder="Price *"><select id="category"><option value="women">Women</option><option value="men">Men</option><option value="gift">Gift</option><option value="sale">Sale</option></select></div>
                <div class="row"><input type="text" id="tag" placeholder="Tag"><input type="text" id="desc" placeholder="Description"></div>
                <button class="btn-gold" onclick="addProduct()">Add Product</button>
                <div id="msg" class="msg"></div>
            </div>
            <div class="card">
                <h2>Products</h2>
                <input type="text" class="search-box" placeholder="Search..." id="searchProd" oninput="renderProducts()">
                <div id="productList">Loading...</div>
            </div>
        </div>
        
        <!-- BLOG TAB -->
        <div class="tab-content" id="tab-blog">
            <div class="card">
                <h2>Add Blog Post</h2>
                <input type="text" id="blogTitle" placeholder="Post Title *">
                <textarea id="blogContent" rows="5" placeholder="Post Content *"></textarea>
                <div class="row"><input type="text" id="blogImage" placeholder="Image URL"><input type="text" id="blogCategory" placeholder="Category (Tips, News, etc.)"></div>
                <button class="btn-gold" onclick="addBlog()">Add Post</button>
                <div id="blogMsg" class="msg"></div>
            </div>
            <div class="card">
                <h2>Blog Posts</h2>
                <div id="blogList">Loading...</div>
            </div>
        </div>
    </div>
</div>

<script>
var API='https://scent-lovers-api.developeraddis.workers.dev/api';
var CLD='dm6rwo1ox',PRESET='scent_lovers_preset',PASS='ScentLovers2026';
var products=[],posts=[];

function login(){if(document.getElementById('pw').value===PASS){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');loadAll()}else{document.getElementById('loginErr').style.display='block'}}

function switchTab(tab){
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('show'));
    document.getElementById('tab-'+tab).classList.add('show');
}

// ============ PRODUCTS ============
async function uploadNew(){var f=document.getElementById('fileInput').files[0];if(!f)return;var s=document.getElementById('upStatus');s.textContent='Uploading...';var fd=new FormData();fd.append('file',f);fd.append('upload_preset',PRESET);var r=await fetch('https://api.cloudinary.com/v1_1/'+CLD+'/image/upload',{method:'POST',body:fd});var d=await r.json();if(d.secure_url){document.getElementById('imgUrl').value=d.secure_url;document.getElementById('preview').src=d.secure_url;document.getElementById('preview').style.display='block';s.textContent='Ready'}else{s.textContent='Failed'}}

async function loadProducts(){
    var r=await fetch(API+'/products');var d=await r.json();products=d.products||[];renderProducts();
}
function renderProducts(){
    var s=(document.getElementById('searchProd')?.value||'').toLowerCase();
    var f=s?products.filter(p=>p.name.toLowerCase().includes(s)||p.brand.toLowerCase().includes(s)):products;
    var c=document.getElementById('productList');
    if(!f.length){c.innerHTML='<p style="text-align:center;color:#888;padding:30px">No products</p>';return}
    c.innerHTML=f.map(p=>'<div class="item-row"><img src="'+(p.image||'https://via.placeholder.com/50')+'" onerror="this.src=\'https://via.placeholder.com/50\'"><div class="info"><h3>'+p.brand+' - '+p.name+'</h3><p>'+p.price+' | '+p.category+'</p></div><button class="btn-red" onclick="delProduct('+p.id+')">Delete</button></div>').join('')
}

async function addProduct(){
    var n=document.getElementById('name').value.trim(),b=document.getElementById('brand').value.trim(),pr=document.getElementById('price').value.trim(),cat=document.getElementById('category').value,img=document.getElementById('imgUrl').value;
    if(!n||!b||!pr){msgP('Fill required fields','error');return}if(!img){msgP('Upload image','error');return}
    await fetch(API+'/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,brand:b,price:pr.includes('ETB')?pr:pr+' ETB',category:cat,image:img,tag:document.getElementById('tag').value,description:document.getElementById('desc').value})});
    msgP('Added!','success');['name','brand','price','tag','desc'].forEach(id=>document.getElementById(id).value='');document.getElementById('preview').style.display='none';document.getElementById('imgUrl').value='';document.getElementById('fileInput').value='';loadProducts();
}
async function delProduct(id){if(!confirm('Delete?'))return;await fetch(API+'/products/'+id,{method:'DELETE'});loadProducts()}
function msgP(t,type){var m=document.getElementById('msg');m.textContent=t;m.className='msg '+type;setTimeout(()=>m.className='msg',3000)}

// ============ BLOG ============
async function loadBlog(){var r=await fetch(API+'/blog');var d=await r.json();posts=d.posts||[];renderBlog()}
function renderBlog(){
    var c=document.getElementById('blogList');
    if(!posts.length){c.innerHTML='<p style="text-align:center;color:#888;padding:30px">No posts</p>';return}
    c.innerHTML=posts.map(p=>'<div class="item-row"><div class="info"><h3>'+p.title+'</h3><p>'+(p.category||'General')+' | '+new Date(p.created_at).toLocaleDateString()+'</p></div><button class="btn-red" onclick="delBlog('+p.id+')">Delete</button></div>').join('')
}
async function addBlog(){
    var t=document.getElementById('blogTitle').value.trim(),c=document.getElementById('blogContent').value.trim();
    if(!t||!c){msgB('Fill required fields','error');return}
    await fetch(API+'/blog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t,content:c,image:document.getElementById('blogImage').value,category:document.getElementById('blogCategory').value})});
    msgB('Added!','success');['blogTitle','blogContent','blogImage','blogCategory'].forEach(id=>document.getElementById(id).value='');loadBlog();
}
async function delBlog(id){if(!confirm('Delete?'))return;await fetch(API+'/blog/'+id,{method:'DELETE'});loadBlog()}
function msgB(t,type){var m=document.getElementById('blogMsg');m.textContent=t;m.className='msg '+type;setTimeout(()=>m.className='msg',3000)}

function loadAll(){loadProducts();loadBlog()}
</script>
</body>
</html>
