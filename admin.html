<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager | Scent Lovers</title>
    <style>
        :root { --gold: #D4A853; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0A0A0A; padding: 20px; color: white; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        .panel { background: #111; padding: 30px; border-radius: 15px; margin-bottom: 30px; border: 1px solid rgba(212,168,83,0.2); }
        h2 { border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 20px; color: var(--gold); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #bbb; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; color: white; font-family: inherit; }
        .upload-area { border: 2px dashed var(--gold); border-radius: 10px; padding: 30px; text-align: center; cursor: pointer; background: #1a1a1a; transition: 0.3s; }
        .upload-area:hover { border-color: #fff; }
        .preview-img { max-width: 200px; margin-top: 15px; display: none; border-radius: 8px; }
        .preview-img.show { display: block; }
        button { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 3px; font-size: 0.9rem; transition: 0.3s; }
        .btn-primary { background: var(--gold); color: black; }
        .btn-primary:hover { background: #c49540; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #e74c3c; }
        .btn-edit { background: #3498db; color: white; }
        .btn-save { background: #27ae60; color: white; }
        .btn-cancel { background: #95a5a6; color: white; }
        .product-item { background: #1a1a1a; padding: 20px; margin: 15px 0; border-radius: 10px; display: flex; gap: 20px; align-items: flex-start; border: 1px solid #333; }
        .product-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
        .item-info { flex: 1; }
        .item-info h3 { color: var(--gold); margin: 0 0 5px; font-size: 1.1rem; }
        .item-price { color: var(--gold); font-weight: bold; font-size: 1.2rem; }
        .item-meta { color: #888; font-size: 0.85rem; margin: 5px 0; }
        .edit-fields { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #333; }
        .editing .edit-fields { display: block; }
        .editing .view-fields { display: none; }
        .status { padding: 12px; margin: 15px 0; border-radius: 8px; display: none; text-align: center; }
        .status.success { background: #27ae60; color: white; display: block; }
        .status.error { background: #c0392b; color: white; display: block; }
        .hidden { display: none !important; }
        .row { display: flex; gap: 20px; }
        .row > div { flex: 1; }
        .product-count { background: var(--gold); color: black; padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        @media (max-width: 768px) {
            .row { flex-direction: column; }
            .product-item { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Login Panel -->
    <div class="panel" id="loginPanel">
        <h2>🔐 Admin Login</h2>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter admin password" onkeypress="if(event.key==='Enter')login()">
        </div>
        <button class="btn-primary" onclick="login()">Access Product Manager</button>
        <div id="loginStatus" class="status"></div>
    </div>
    
    <!-- Admin Panel (hidden until login) -->
    <div class="panel hidden" id="adminPanel">
        <h2>➕ Add New Product</h2>
        
        <div class="form-group">
            <label>📸 Product Image</label>
            <div class="upload-area" onclick="document.getElementById('imageInput').click()">
                <div style="font-size:40px;">📷</div>
                <div>Click to upload product photo</div>
                <div style="font-size:0.8rem; color:#888;">JPG, PNG or WEBP</div>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImage(event)">
            <img id="preview" class="preview-img" alt="Preview">
            <div id="uploadStatus" style="font-size:0.8rem; margin-top:5px;"></div>
        </div>
        
        <div class="row">
            <div class="form-group">
                <label>📝 Product Name *</label>
                <input type="text" id="productName" placeholder="e.g., Rose Elegance">
            </div>
            <div class="form-group">
                <label>🏷️ Brand *</label>
                <input type="text" id="productBrand" placeholder="e.g., Chanel">
            </div>
        </div>
        
        <div class="row">
            <div class="form-group">
                <label>💰 Price (ETB) *</label>
                <input type="text" id="productPrice" placeholder="e.g., 4500">
            </div>
            <div class="form-group">
                <label>📂 Category *</label>
                <select id="productCategory">
                    <option value="women">👩 Women's Perfumes</option>
                    <option value="men">👨 Men's Colognes</option>
                    <option value="gift">🎁 Gift Sets</option>
                    <option value="sale">🔥 Sale / Offers</option>
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="form-group">
                <label>📋 Description</label>
                <textarea id="productDesc" rows="2" placeholder="Brief description..."></textarea>
            </div>
            <div class="form-group">
                <label>🏷️ Tag</label>
                <input type="text" id="productTag" placeholder="Bestseller, New, Sale, etc.">
            </div>
        </div>
        
        <button class="btn-primary" onclick="addProduct()">✅ Add Product</button>
        <div id="statusMsg" class="status"></div>
        
        <h2 style="margin-top:40px;">
            📋 All Products 
            <span class="product-count" id="productCountBadge">0</span>
        </h2>
        
        <div id="productsList">
            <div style="text-align:center; padding:40px; color:#888;">Loading products...</div>
        </div>
    </div>
</div>

<script>
    // ============ CONFIGURATION ============
    const API_URL = 'https://scent-lovers-api.developeraddis.workers.dev';
    const CLOUD_NAME = 'dm6rwo1ox';
    const UPLOAD_PRESET = 'scent_lovers_preset';
    const ADMIN_PASS = 'ScentLovers2026';
    
    let authToken = null;
    let allProducts = [];
    let newImageUrl = '';
    let editImageUrls = {};
    
    // ============ LOGIN ============
    async function login() {
        const pass = document.getElementById('password').value;
        
        if (pass !== ADMIN_PASS) { 
            document.getElementById('loginStatus').textContent = '❌ Wrong password';
            document.getElementById('loginStatus').className = 'status error';
            return; 
        }
        
        authToken = btoa(`scentlovers:${pass}`);
        document.getElementById('loginPanel').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        await loadProducts();
    }
    
    // ============ LOAD PRODUCTS ============
    async function loadProducts() {
        try {
            const res = await fetch(`${API_URL}/api/products`);
            const data = await res.json();
            console.log('API Response:', data);
            
            if (data.success && Array.isArray(data.products)) {
                allProducts = data.products;
                document.getElementById('productCountBadge').textContent = allProducts.length;
                renderProducts();
            } else {
                console.error('Invalid data format:', data);
                document.getElementById('productsList').innerHTML = 
                    '<div style="text-align:center; padding:20px; color:#e74c3c;">Error loading products</div>';
            }
        } catch(e) { 
            console.error('Load error:', e);
            document.getElementById('productsList').innerHTML = 
                '<div style="text-align:center; padding:20px; color:#e74c3c;">Connection error</div>';
        }
    }
    
    // ============ RENDER PRODUCTS ============
    function renderProducts() {
        const container = document.getElementById('productsList');
        
        if (allProducts.length === 0) {
            container.innerHTML = `
                <div style="text-align:center; padding:40px; color:#888;">
                    <div style="font-size:48px; margin-bottom:15px;">📦</div>
                    <p>No products added yet.</p>
                    <p style="font-size:0.9rem;">Use the form above to add your first product!</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = allProducts.map(p => `
            <div class="product-item" id="product-${p.id}">
                <img src="${p.image || 'https://via.placeholder.com/100x100?text=No+Image'}" 
                     alt="${escapeHtml(p.name)}" 
                     onerror="this.src='https://via.placeholder.com/100x100?text=No+Image'">
                <div class="item-info">
                    <div class="view-fields">
                        <h3>${escapeHtml(p.brand)} - ${escapeHtml(p.name)}</h3>
                        <div class="item-price">${escapeHtml(p.price)}</div>
                        <div class="item-meta">
                            Category: ${p.category || 'N/A'} | 
                            Tag: ${p.tag || 'None'} | 
                            Added: ${p.createdAt ? new Date(p.createdAt).toLocaleDateString() : 'N/A'}
                        </div>
                        ${p.description ? `<div class="item-meta">${escapeHtml(p.description)}</div>` : ''}
                    </div>
                    <div class="edit-fields">
                        <label>New Image (optional)</label>
                        <input type="file" id="editFile-${p.id}" accept="image/*" onchange="handleEditImage(event, '${p.id}')">
                        <div id="editStatus-${p.id}" style="font-size:0.8rem; margin:5px 0;"></div>
                        <label>Name</label>
                        <input type="text" id="editName-${p.id}" value="${escapeHtml(p.name)}">
                        <label>Brand</label>
                        <input type="text" id="editBrand-${p.id}" value="${escapeHtml(p.brand)}">
                        <label>Price</label>
                        <input type="text" id="editPrice-${p.id}" value="${(p.price || '').replace(' ETB', '')}">
                        <label>Category</label>
                        <select id="editCat-${p.id}">
                            <option value="women" ${p.category==='women'?'selected':''}>Women</option>
                            <option value="men" ${p.category==='men'?'selected':''}>Men</option>
                            <option value="gift" ${p.category==='gift'?'selected':''}>Gift Sets</option>
                            <option value="sale" ${p.category==='sale'?'selected':''}>Sale/Offers</option>
                        </select>
                        <label>Description</label>
                        <textarea id="editDesc-${p.id}" rows="2">${escapeHtml(p.description || '')}</textarea>
                        <label>Tag</label>
                        <input type="text" id="editTag-${p.id}" value="${escapeHtml(p.tag || '')}">
                        <input type="hidden" id="editImage-${p.id}" value="${p.image || ''}">
                    </div>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px; min-width:80px;">
                    <button class="btn-edit" id="editBtn-${p.id}" onclick="startEdit('${p.id}')">✏️ Edit</button>
                    <button class="btn-save hidden" id="saveBtn-${p.id}" onclick="saveEdit('${p.id}')">💾 Save</button>
                    <button class="btn-cancel hidden" id="cancelBtn-${p.id}" onclick="cancelEdit('${p.id}')">Cancel</button>
                    <button class="btn-danger" onclick="deleteProduct('${p.id}')">🗑️ Delete</button>
                </div>
            </div>
        `).join('');
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    
    // ============ IMAGE UPLOAD ============
    async function uploadImage(file, statusElementId) {
        const statusEl = document.getElementById(statusElementId);
        if (statusEl) {
            statusEl.textContent = '⏳ Uploading...';
            statusEl.style.color = '#D4A853';
        }
        
        const fd = new FormData();
        fd.append('file', file);
        fd.append('upload_preset', UPLOAD_PRESET);
        
        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: fd
            });
            const data = await res.json();
            
            if (data.secure_url) {
                if (statusEl) {
                    statusEl.textContent = '✅ Image ready!';
                    statusEl.style.color = '#27ae60';
                }
                return data.secure_url;
            } else {
                if (statusEl) {
                    statusEl.textContent = '❌ Upload failed';
                    statusEl.style.color = '#e74c3c';
                }
                return null;
            }
        } catch(e) {
            if (statusEl) {
                statusEl.textContent = '❌ Upload error';
                statusEl.style.color = '#e74c3c';
            }
            return null;
        }
    }
    
    async function handleImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        // Show preview
        const reader = new FileReader();
        reader.onload = ev => {
            document.getElementById('preview').src = ev.target.result;
            document.getElementById('preview').classList.add('show');
        };
        reader.readAsDataURL(file);
        
        // Upload
        const url = await uploadImage(file, 'uploadStatus');
        if (url) {
            newImageUrl = url;
        }
    }
    
    async function handleEditImage(event, id) {
        const file = event.target.files[0];
        if (!file) return;
        
        const url = await uploadImage(file, `editStatus-${id}`);
        if (url) {
            editImageUrls[id] = url;
            document.getElementById(`editImage-${id}`).value = url;
        }
    }
    
    // ============ ADD PRODUCT ============
    async function addProduct() {
        const name = document.getElementById('productName').value.trim();
        const brand = document.getElementById('productBrand').value.trim();
        const price = document.getElementById('productPrice').value.trim();
        
        if (!name || !brand || !price) {
            showStatus('❌ Name, brand and price are required', 'error');
            return;
        }
        
        if (!newImageUrl) {
            showStatus('❌ Please upload an image first', 'error');
            return;
        }
        
        const product = {
            name,
            brand,
            price: price.includes('ETB') ? price : price + ' ETB',
            category: document.getElementById('productCategory').value,
            description: document.getElementById('productDesc').value.trim(),
            image: newImageUrl,
            tag: document.getElementById('productTag').value.trim()
        };
        
        try {
            const res = await fetch(`${API_URL}/api/admin/products`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Auth': authToken
                },
                body: JSON.stringify(product)
            });
            const data = await res.json();
            
            if (data.success) {
                showStatus('✅ Product added successfully!', 'success');
                
                // Clear form
                ['productName', 'productBrand', 'productPrice', 'productDesc', 'productTag'].forEach(id => {
                    document.getElementById(id).value = '';
                });
                document.getElementById('preview').classList.remove('show');
                newImageUrl = '';
                document.getElementById('imageInput').value = '';
                document.getElementById('uploadStatus').textContent = '';
                
                await loadProducts();
            } else {
                showStatus('❌ Failed: ' + (data.error || 'Unknown error'), 'error');
            }
        } catch(e) {
            showStatus('❌ Connection error: ' + e.message, 'error');
        }
    }
    
    // ============ EDIT PRODUCT ============
    function startEdit(id) {
        const item = document.getElementById(`product-${id}`);
        if (item) item.classList.add('editing');
        document.getElementById(`editBtn-${id}`).classList.add('hidden');
        document.getElementById(`saveBtn-${id}`).classList.remove('hidden');
        document.getElementById(`cancelBtn-${id}`).classList.remove('hidden');
    }
    
    function cancelEdit(id) {
        const item = document.getElementById(`product-${id}`);
        if (item) item.classList.remove('editing');
        document.getElementById(`editBtn-${id}`).classList.remove('hidden');
        document.getElementById(`saveBtn-${id}`).classList.add('hidden');
        document.getElementById(`cancelBtn-${id}`).classList.add('hidden');
        delete editImageUrls[id];
        loadProducts(); // Reload to reset
    }
    
    async function saveEdit(id) {
        const name = document.getElementById(`editName-${id}`).value.trim();
        const brand = document.getElementById(`editBrand-${id}`).value.trim();
        const price = document.getElementById(`editPrice-${id}`).value.trim();
        const category = document.getElementById(`editCat-${id}`).value;
        const description = document.getElementById(`editDesc-${id}`).value.trim();
        const tag = document.getElementById(`editTag-${id}`).value.trim();
        const image = editImageUrls[id] || document.getElementById(`editImage-${id}`).value;
        
        if (!name || !brand || !price) {
            showStatus('❌ Name, brand and price required', 'error');
            return;
        }
        
        const updatedProduct = {
            name,
            brand,
            price: price.includes('ETB') ? price : price + ' ETB',
            category,
            description,
            image,
            tag
        };
        
        try {
            const res = await fetch(`${API_URL}/api/admin/products/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Auth': authToken
                },
                body: JSON.stringify(updatedProduct)
            });
            const data = await res.json();
            
            if (data.success) {
                showStatus('✅ Product updated!', 'success');
                delete editImageUrls[id];
                await loadProducts();
            } else {
                showStatus('❌ Update failed: ' + (data.error || ''), 'error');
            }
        } catch(e) {
            showStatus('❌ Error: ' + e.message, 'error');
        }
    }
    
    // ============ DELETE PRODUCT ============
    async function deleteProduct(id) {
        if (!confirm('Are you sure you want to delete this product permanently?')) return;
        
        try {
            const res = await fetch(`${API_URL}/api/admin/products/${id}`, {
                method: 'DELETE',
                headers: { 'X-Admin-Auth': authToken }
            });
            const data = await res.json();
            
            if (data.success) {
                showStatus('✅ Product deleted', 'success');
                await loadProducts();
            } else {
                showStatus('❌ Delete failed: ' + (data.error || ''), 'error');
            }
        } catch(e) {
            showStatus('❌ Error: ' + e.message, 'error');
        }
    }
    
    function showStatus(msg, type) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = `status ${type}`;
        setTimeout(() => { el.className = 'status'; }, 4000);
    }
</script>
</body>
</html>
