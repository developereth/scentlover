<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scent Lovers - Complete Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0A0A0A; color: #FFFFFF; }
        
        .login-container { max-width: 420px; margin: 100px auto; background: #111; padding: 45px; border-radius: 28px; border: 1px solid #D4A853; text-align: center; }
        .login-container h2 { color: #D4A853; margin-bottom: 20px; font-family: 'Playfair Display', serif; }
        .login-container input { width: 100%; padding: 14px; margin: 12px 0; background: #1a1a1a; border: 1px solid #333; border-radius: 14px; color: white; font-size: 1rem; }
        .login-container button { width: 100%; padding: 14px; background: #D4A853; color: #000; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .login-container button:hover { background: #B8933F; transform: translateY(-2px); }
        
        .admin-container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 25px; border-bottom: 1px solid rgba(212,168,83,0.3); margin-bottom: 35px; flex-wrap: wrap; gap: 15px; }
        .admin-header h1 { color: #D4A853; font-family: 'Playfair Display', serif; font-size: 1.8rem; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 10px 24px; border-radius: 50px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .logout-btn:hover { background: #c0392b; transform: translateY(-2px); }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; flex-wrap: wrap; }
        .tab { padding: 12px 24px; background: none; border: none; color: #999; cursor: pointer; border-radius: 40px; font-weight: 600; transition: 0.3s; }
        .tab:hover { color: #D4A853; }
        .tab.active { background: #D4A853; color: #000; }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 8px; color: #D4A853; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 14px; color: white; font-family: inherit; font-size: 0.95rem; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #D4A853; }
        .btn-save { background: #D4A853; color: #000; border: none; padding: 14px 32px; border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-top: 10px; }
        .btn-save:hover { background: #B8933F; transform: translateY(-2px); }
        
        /* Product List Styles */
        .products-container { max-height: 600px; overflow-y: auto; }
        .category-section { margin-bottom: 40px; background: #0d0d0d; border-radius: 20px; padding: 20px; border: 1px solid rgba(212,168,83,0.2); }
        .category-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #D4A853; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #D4A853; display: inline-block; }
        .category-title i { margin-right: 10px; }
        .product-list { display: flex; flex-direction: column; gap: 12px; }
        .product-item { background: #1a1a1a; padding: 18px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border: 1px solid #2a2a2a; transition: 0.3s; }
        .product-item:hover { border-color: #D4A853; }
        .product-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .product-image { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; background: #0d0d0d; }
        .product-details h4 { margin-bottom: 5px; font-size: 1rem; }
        .product-details p { font-size: 0.75rem; color: #999; }
        .product-price { color: #D4A853; font-weight: 700; font-size: 1.1rem; }
        .product-actions { display: flex; gap: 10px; }
        .product-actions button { background: none; border: none; color: #D4A853; cursor: pointer; font-size: 1.1rem; padding: 8px 12px; border-radius: 8px; transition: 0.3s; }
        .product-actions button:hover { background: rgba(212,168,83,0.2); }
        .delete-btn { color: #e74c3c !important; }
        .delete-btn:hover { background: rgba(231,76,60,0.2) !important; }
        
        .image-preview { width: 100px; height: 100px; object-fit: cover; border-radius: 14px; margin-top: 12px; border: 2px solid #D4A853; }
        .upload-progress { color: #D4A853; margin-top: 8px; font-size: 0.85rem; }
        .success-msg { background: #27ae60; padding: 14px; border-radius: 12px; margin-bottom: 20px; text-align: center; font-weight: 500; }
        .error-msg { background: #e74c3c; padding: 14px; border-radius: 12px; margin-bottom: 20px; text-align: center; font-weight: 500; }
        
        .stores-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .store-item { background: #1a1a1a; padding: 18px; border-radius: 16px; border: 1px solid #2a2a2a; }
        
        @media (max-width: 768px) {
            .admin-container { padding: 1rem; }
            .product-item { flex-direction: column; text-align: center; }
            .product-info { justify-content: center; }
            .tab { padding: 8px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Login Screen -->
    <div id="loginSection" class="login-container">
        <h2><i class="fas fa-crown"></i> Scent Lovers Admin</h2>
        <p style="color:#999; margin-bottom:25px;">Enter your credentials to manage all content</p>
        <input type="text" id="adminUsername" placeholder="Username" value="scentlovers">
        <input type="password" id="adminPassword" placeholder="Password">
        <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login to Dashboard</button>
    </div>
    
    <!-- Dashboard -->
    <div id="dashboardSection" class="admin-container" style="display:none;">
        <div class="admin-header">
            <h1><i class="fas fa-crown"></i> Scent Lovers Complete Admin</h1>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        
        <div class="tabs">
            <button class="tab active" data-tab="products">📦 All Products</button>
            <button class="tab" data-tab="add">➕ Add Product</button>
            <button class="tab" data-tab="settings">⚙️ Site Settings</button>
            <button class="tab" data-tab="stores">📍 Stores</button>
            <button class="tab" data-tab="contact">📞 Contact</button>
        </div>
        
        <!-- All Products Tab - Shows products by category -->
        <div id="productsTab" class="tab-content active">
            <h3 style="margin-bottom:20px;">Manage All Products (Women, Men, Gift, Offers)</h3>
            <div id="productsContainer" class="products-container">
                <div style="text-align: center; padding: 40px;">Loading products...</div>
            </div>
        </div>
        
        <!-- Add Product Tab -->
        <div id="addTab" class="tab-content">
            <h3 style="margin-bottom:20px;">Add New Product</h3>
            <div id="addMessage"></div>
            <form id="addProductForm">
                <div class="form-group"><label>Product Name *</label><input type="text" id="productName" required></div>
                <div class="form-group"><label>Brand *</label><input type="text" id="productBrand" required></div>
                <div class="form-group"><label>Price (ETB) *</label><input type="text" id="productPrice" required></div>
                <div class="form-group"><label>Category *</label>
                    <select id="productCategory">
                        <option value="women">👩 Women's Perfumes</option>
                        <option value="men">👨 Men's Colognes</option>
                        <option value="gift">🎁 Gift Sets</option>
                        <option value="sale">🔥 Sale / Offers</option>
                    </select>
                </div>
                <div class="form-group"><label>Product Image</label>
                    <input type="file" id="imageUpload" accept="image/*">
                    <div id="uploadProgress" class="upload-progress" style="display:none;">Uploading to Cloudinary...</div>
                    <input type="text" id="productImageUrl" placeholder="Or enter image URL directly" style="margin-top:10px;">
                    <div id="imagePreview"></div>
                </div>
                <div class="form-group"><label>Description</label><textarea id="productDesc" rows="3"></textarea></div>
                <div class="form-group"><label>Tag (Bestseller, New, Sale)</label><input type="text" id="productTag" placeholder="Optional"></div>
                <button type="submit" class="btn-save"><i class="fas fa-plus"></i> Add Product</button>
            </form>
        </div>
        
        <!-- Settings Tab -->
        <div id="settingsTab" class="tab-content">
            <h3 style="margin-bottom:20px;">Site Settings</h3>
            <div id="settingsMessage"></div>
            <form id="settingsForm">
                <div class="form-group"><label>Hero Title</label><input type="text" id="heroTitle"></div>
                <div class="form-group"><label>Hero Subtitle</label><input type="text" id="heroSubtitle"></div>
                <div class="form-group"><label>Hero Description</label><textarea id="heroDesc" rows="2"></textarea></div>
                <div class="form-group"><label>Hero Background Image URL</label><input type="text" id="heroBg"></div>
                <div class="form-group"><label>Top Bar Left Text</label><input type="text" id="topbarLeft"></div>
                <div class="form-group"><label>Top Bar Right Text</label><input type="text" id="topbarRight"></div>
                <div class="form-group"><label>Footer Text</label><textarea id="footerText" rows="2"></textarea></div>
                <div class="form-group"><label>Phone Number</label><input type="text" id="phoneNumber"></div>
                <div class="form-group"><label>Telegram Username</label><input type="text" id="telegramUsername"></div>
                <div class="form-group"><label>WhatsApp Number</label><input type="text" id="whatsappNumber"></div>
                <button type="submit" class="btn-save"><i class="fas fa-save"></i> Save Settings</button>
            </form>
        </div>
        
        <!-- Stores Tab -->
        <div id="storesTab" class="tab-content">
            <h3 style="margin-bottom:20px;">Manage Store Locations</h3>
            <div id="storesMessage"></div>
            <div id="storesList" class="stores-grid"></div>
            <button id="addStoreBtn" class="btn-save" style="margin-top:20px;"><i class="fas fa-plus"></i> Add New Store</button>
            <div id="addStoreForm" style="display:none; margin-top:20px; background:#1a1a1a; padding:20px; border-radius:16px;">
                <h4 style="color:#D4A853; margin-bottom:15px;">New Store Location</h4>
                <div class="form-group"><label>Store Name</label><input type="text" id="newStoreName"></div>
                <div class="form-group"><label>Address</label><input type="text" id="newStoreAddress"></div>
                <div class="form-group"><label>Hours</label><input type="text" id="newStoreHours"></div>
                <div class="form-group"><label>Phone</label><input type="text" id="newStorePhone"></div>
                <button id="saveNewStoreBtn" class="btn-save">Save Store</button>
                <button id="cancelStoreBtn" class="btn-save" style="background:#666; margin-left:10px;">Cancel</button>
            </div>
        </div>
        
        <!-- Contact Tab -->
        <div id="contactTab" class="tab-content">
            <h3 style="margin-bottom:20px;">Contact Information</h3>
            <div id="contactMessage"></div>
            <form id="contactForm">
                <div class="form-group"><label>Phone Number</label><input type="text" id="contactPhone"></div>
                <div class="form-group"><label>Email Address</label><input type="email" id="contactEmail"></div>
                <div class="form-group"><label>Address</label><input type="text" id="contactAddress"></div>
                <div class="form-group"><label>Business Hours</label><input type="text" id="contactHours"></div>
                <button type="submit" class="btn-save"><i class="fas fa-save"></i> Save Contact Info</button>
            </form>
        </div>
    </div>
</div>

<script>
    // ============================================
    // SCENT LOVERS - COMPLETE ADMIN DASHBOARD
    // Shows ALL products by category
    // ============================================
    
    const API_URL = 'https://scent-lovers-api.developeraddis.workers.dev';
    const CLOUDINARY_CLOUD_NAME = 'dm6rwo1ox';
    const CLOUDINARY_UPLOAD_PRESET = 'scent_lovers_preset';
    
    let authToken = null;
    let allProducts = [];
    
    // Category display names and icons
    const categoryConfig = {
        women: { name: '👩 Women\'s Perfumes', icon: 'fa-female', color: '#D4A853' },
        men: { name: '👨 Men\'s Colognes', icon: 'fa-male', color: '#D4A853' },
        gift: { name: '🎁 Gift Sets', icon: 'fa-gift', color: '#D4A853' },
        sale: { name: '🔥 Sale / Offers', icon: 'fa-tag', color: '#D4A853' },
        uncategorized: { name: '📦 Uncategorized', icon: 'fa-box', color: '#999' }
    };
    
    // ========== AUTHENTICATION ==========
    function checkSession() {
        const savedToken = localStorage.getItem('adminToken');
        if (savedToken) { authToken = savedToken; verifyAndLoadDashboard(); }
        else showLogin();
    }
    
    async function verifyAndLoadDashboard() {
        try {
            const response = await fetch(`${API_URL}/api/admin/verify`, { headers: { 'X-Admin-Auth': authToken } });
            if (response.ok) { showDashboard(); loadAllData(); }
            else showLogin();
        } catch { showLogin(); }
    }
    
    function showLogin() { 
        document.getElementById('loginSection').style.display = 'block'; 
        document.getElementById('dashboardSection').style.display = 'none'; 
        localStorage.removeItem('adminToken'); 
        authToken = null; 
    }
    
    function showDashboard() { 
        document.getElementById('loginSection').style.display = 'none'; 
        document.getElementById('dashboardSection').style.display = 'block'; 
    }
    
    document.getElementById('loginBtn')?.addEventListener('click', async () => {
        const username = document.getElementById('adminUsername').value;
        const password = document.getElementById('adminPassword').value;
        try {
            const response = await fetch(`${API_URL}/api/admin/login`, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ username, password }) 
            });
            const data = await response.json();
            if (data.success) { 
                authToken = data.token; 
                localStorage.setItem('adminToken', authToken); 
                showDashboard(); 
                loadAllData();
            } else alert('Invalid credentials!');
        } catch (error) { alert('Login error: ' + error.message); }
    });
    
    document.getElementById('logoutBtn')?.addEventListener('click', showLogin);
    
    // ========== LOAD ALL DATA ==========
    async function loadAllData() {
        await loadProducts();
        await loadSettings();
        await loadStores();
        await loadContactInfo();
    }
    
    // ========== PRODUCTS - Shows ALL by category ==========
    async function loadProducts() {
        try {
            const response = await fetch(`${API_URL}/api/products`);
            const data = await response.json();
            console.log('Raw API response:', data);
            
            if (data.success) {
                // Parse products if it's a string
                let products = data.products;
                if (typeof products === 'string') {
                    products = JSON.parse(products);
                }
                allProducts = Array.isArray(products) ? products : [];
                console.log('Parsed products:', allProducts);
                renderProductsByCategory();
            } else {
                allProducts = [];
                renderProductsByCategory();
            }
        } catch (error) {
            console.error('Error loading products:', error);
            allProducts = [];
            renderProductsByCategory();
        }
    }
    
    function renderProductsByCategory() {
        const container = document.getElementById('productsContainer');
        if (!container) return;
        
        // Group products by category
        const productsByCategory = {
            women: [],
            men: [],
            gift: [],
            sale: [],
            uncategorized: []
        };
        
        allProducts.forEach(product => {
            const category = product.category || 'uncategorized';
            if (productsByCategory[category]) {
                productsByCategory[category].push(product);
            } else {
                productsByCategory.uncategorized.push(product);
            }
        });
        
        // Build HTML for each category that has products
        let html = '';
        for (const [cat, products] of Object.entries(productsByCategory)) {
            if (products.length > 0) {
                const config = categoryConfig[cat] || categoryConfig.uncategorized;
                html += `
                    <div class="category-section">
                        <div class="category-title">
                            <i class="fas ${config.icon}"></i> ${config.name} (${products.length} products)
                        </div>
                        <div class="product-list">
                            ${products.map(product => `
                                <div class="product-item">
                                    <div class="product-info">
                                        ${product.image ? `<img src="${product.image}" class="product-image" onerror="this.src='https://via.placeholder.com/60x60?text=No+Image'">` : '<div class="product-image" style="background:#2a2a2a; display:flex; align-items:center; justify-content:center;"><i class="fas fa-image"></i></div>'}
                                        <div class="product-details">
                                            <h4>${escapeHtml(product.brand)} - ${escapeHtml(product.name)}</h4>
                                            <p>ID: ${product.id} | ${product.tag ? 'Tag: ' + product.tag : ''}</p>
                                            ${product.description ? `<p style="color:#888; font-size:0.7rem;">${escapeHtml(product.description.substring(0, 80))}${product.description.length > 80 ? '...' : ''}</p>` : ''}
                                        </div>
                                        <div class="product-price">${product.price}</div>
                                    </div>
                                    <div class="product-actions">
                                        <button onclick="editProduct('${product.id}')" title="Edit Product"><i class="fas fa-edit"></i> Edit</button>
                                        <button onclick="deleteProduct('${product.id}')" class="delete-btn" title="Delete Product"><i class="fas fa-trash"></i> Delete</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }
        
        if (allProducts.length === 0) {
            html = '<div style="text-align: center; padding: 40px; color: #999;">No products yet. Click "Add Product" to create your first product!</div>';
        }
        
        container.innerHTML = html;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    window.deleteProduct = async function(id) {
        if (!confirm('Delete this product? This cannot be undone.')) return;
        try {
            const response = await fetch(`${API_URL}/api/admin/products/${id}`, { 
                method: 'DELETE', 
                headers: { 'X-Admin-Auth': authToken } 
            });
            if (response.ok) { 
                alert('Product deleted!'); 
                await loadProducts(); 
            } else alert('Delete failed');
        } catch (error) { alert('Error: ' + error.message); }
    };
    
    window.editProduct = function(id) {
        const product = allProducts.find(p => p.id == id);
        if (product) {
            document.getElementById('productName').value = product.name || '';
            document.getElementById('productBrand').value = product.brand || '';
            const priceValue = (product.price || '').replace(' ETB', '');
            document.getElementById('productPrice').value = priceValue;
            document.getElementById('productCategory').value = product.category || 'women';
            document.getElementById('productDesc').value = product.description || '';
            document.getElementById('productImageUrl').value = product.image || '';
            document.getElementById('productTag').value = product.tag || '';
            document.getElementById('imagePreview').innerHTML = product.image ? `<img src="${product.image}" class="image-preview">` : '';
            
            // Switch to add tab
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector('.tab[data-tab="add"]').classList.add('active');
            document.getElementById('addTab').classList.add('active');
            window.editingProductId = id;
            
            // Change button text
            const submitBtn = document.querySelector('#addProductForm .btn-save');
            if (submitBtn) submitBtn.innerHTML = '<i class="fas fa-save"></i> Update Product';
        }
    };
    
    async function uploadToCloudinary(file) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
        const data = await response.json();
        return data.secure_url;
    }
    
    document.getElementById('addProductForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const progressDiv = document.getElementById('uploadProgress');
        const messageDiv = document.getElementById('addMessage');
        let imageUrl = document.getElementById('productImageUrl').value;
        const imageFile = document.getElementById('imageUpload').files[0];
        
        if (imageFile) {
            progressDiv.style.display = 'block';
            try { 
                imageUrl = await uploadToCloudinary(imageFile); 
                progressDiv.style.display = 'none'; 
            } catch (error) { 
                progressDiv.style.display = 'none'; 
                messageDiv.innerHTML = '<div class="error-msg">Image upload failed!</div>'; 
                return; 
            }
        }
        
        const productData = { 
            name: document.getElementById('productName').value, 
            brand: document.getElementById('productBrand').value, 
            price: document.getElementById('productPrice').value + ' ETB', 
            category: document.getElementById('productCategory').value, 
            image: imageUrl, 
            description: document.getElementById('productDesc').value,
            tag: document.getElementById('productTag').value
        };
        
        try {
            let response;
            if (window.editingProductId) {
                response = await fetch(`${API_URL}/api/admin/products/${window.editingProductId}`, { 
                    method: 'PUT', 
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Auth': authToken }, 
                    body: JSON.stringify(productData) 
                });
                delete window.editingProductId;
                messageDiv.innerHTML = '<div class="success-msg">Product updated successfully!</div>';
                // Reset button text
                const submitBtn = document.querySelector('#addProductForm .btn-save');
                if (submitBtn) submitBtn.innerHTML = '<i class="fas fa-plus"></i> Add Product';
            } else {
                response = await fetch(`${API_URL}/api/admin/products`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Auth': authToken }, 
                    body: JSON.stringify(productData) 
                });
                messageDiv.innerHTML = '<div class="success-msg">Product added successfully!</div>';
            }
            if (response.ok) { 
                e.target.reset(); 
                document.getElementById('imagePreview').innerHTML = ''; 
                document.getElementById('imageUpload').value = '';
                await loadProducts(); 
                setTimeout(() => messageDiv.innerHTML = '', 3000); 
            }
        } catch (error) { messageDiv.innerHTML = `<div class="error-msg">Error: ${error.message}</div>`; }
    });
    
    // Reset form when switching to add tab
    document.querySelector('.tab[data-tab="add"]')?.addEventListener('click', () => {
        if (!window.editingProductId) {
            document.getElementById('addProductForm')?.reset();
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('addMessage').innerHTML = '';
            const submitBtn = document.querySelector('#addProductForm .btn-save');
            if (submitBtn) submitBtn.innerHTML = '<i class="fas fa-plus"></i> Add Product';
        }
    });
    
    // ========== SETTINGS ==========
    async function loadSettings() {
        try {
            const response = await fetch(`${API_URL}/api/settings`);
            const data = await response.json();
            if (data.success && data.settings) { 
                const s = data.settings;
                document.getElementById('heroTitle').value = s.heroTitle || '';
                document.getElementById('heroSubtitle').value = s.heroSubtitle || '';
                document.getElementById('heroDesc').value = s.heroDesc || '';
                document.getElementById('heroBg').value = s.heroBg || '';
                document.getElementById('topbarLeft').value = s.topbarLeft || 'Free Delivery on Orders Over 5,000 ETB';
                document.getElementById('topbarRight').value = s.topbarRight || '2 Free Samples with Every Order';
                document.getElementById('footerText').value = s.footerText || '© 2026 Scent Lovers Perfume. All rights reserved.';
                document.getElementById('phoneNumber').value = s.phoneNumber || '+251 900 000 000';
                document.getElementById('telegramUsername').value = s.telegramUsername || 'scentlovers';
                document.getElementById('whatsappNumber').value = s.whatsappNumber || '251900000000';
            }
        } catch (error) { console.error('Error loading settings:', error); }
    }
    
    document.getElementById('settingsForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const settings = { 
            heroTitle: document.getElementById('heroTitle').value, 
            heroSubtitle: document.getElementById('heroSubtitle').value, 
            heroDesc: document.getElementById('heroDesc').value, 
            heroBg: document.getElementById('heroBg').value,
            topbarLeft: document.getElementById('topbarLeft').value,
            topbarRight: document.getElementById('topbarRight').value,
            footerText: document.getElementById('footerText').value,
            phoneNumber: document.getElementById('phoneNumber').value, 
            telegramUsername: document.getElementById('telegramUsername').value, 
            whatsappNumber: document.getElementById('whatsappNumber').value 
        };
        try {
            const response = await fetch(`${API_URL}/api/admin/settings`, { 
                method: 'PUT', 
                headers: { 'Content-Type': 'application/json', 'X-Admin-Auth': authToken }, 
                body: JSON.stringify(settings) 
            });
            if (response.ok) { 
                const msgDiv = document.getElementById('settingsMessage'); 
                msgDiv.innerHTML = '<div class="success-msg">Settings saved successfully!</div>'; 
                setTimeout(() => msgDiv.innerHTML = '', 3000); 
            }
        } catch (error) { alert('Error saving settings: ' + error.message); }
    });
    
    // ========== STORES ==========
    let stores = [];
    
    async function loadStores() {
        try {
            const response = await fetch(`${API_URL}/api/stores`);
            const data = await response.json();
            if (data.success) { stores = data.stores || []; renderStoresList(); }
        } catch (error) { console.error('Error loading stores:', error); stores = []; renderStoresList(); }
    }
    
    function renderStoresList() {
        const container = document.getElementById('storesList');
        if (!container) return;
        if (stores.length === 0) { 
            container.innerHTML = '<p style="text-align:center; color:#999;">No stores added yet.</p>'; 
            return; 
        }
        container.innerHTML = stores.map((store, index) => `
            <div class="store-item">
                <h4 style="color:#D4A853;">${store.name}</h4>
                <p><i class="fas fa-map-marker-alt"></i> ${store.address}</p>
                <p><i class="fas fa-clock"></i> ${store.hours}</p>
                <p><i class="fas fa-phone"></i> ${store.phone}</p>
                <button onclick="deleteStore(${index})" class="delete-btn" style="margin-top:10px; background:none; border:none; cursor:pointer;">Delete</button>
            </div>
        `).join('');
    }
    
    window.deleteStore = async function(index) {
        if (!confirm('Delete this store?')) return;
        stores.splice(index, 1);
        await fetch(`${API_URL}/api/admin/stores`, { 
            method: 'PUT', 
            headers: { 'Content-Type': 'application/json', 'X-Admin-Auth': authToken }, 
            body: JSON.stringify(stores) 
        });
        await loadStores();
    };
    
    document.getElementById('addStoreBtn')?.addEventListener('click', () => {
        document.getElementById('addStoreForm').style.display = 'block';
    });
    
    document.getElementById('cancelStoreBtn')?.addEventListener('click', () => {
        document.getElementById('addStoreForm').style.display = 'none';
        document.getElementById('newStoreName').value = '';
        document.getElementById('newStoreAddress').value = '';
        document.getElementById('newStoreHours').value = '';
        document.getElementById('newStorePhone').value = '';
    });
    
    document.getElementById('saveNewStoreBtn')?.addEventListener('click', async () => {
        const newStore = {
            name: document.getElementById('newStoreName').value,
            address: document.getElementById('newStoreAddress').value,
            hours: document.getElementById('newStoreHours').value,
            phone: document.getElementById('newStorePhone').value
        };
        if (!newStore.name) { alert('Store name required'); return; }
        stores.push(newStore);
        await fetch(`${API_URL}/api/admin/stores`, { 
            method: 'PUT', 
            headers: { 'Content-Type': 'application/json', 'X-Admin-Auth': authToken }, 
            body: JSON.stringify(stores) 
        });
        document.getElementById('addStoreForm').style.display = 'none';
        document.getElementById('newStoreName').value = '';
        document.getElementById('newStoreAddress').value = '';
        document.getElementById('newStoreHours').value = '';
        document.getElementById('newStorePhone').value = '';
        await loadStores();
    });
    
    // ========== CONTACT INFO ==========
    async function loadContactInfo() {
        try {
            const response = await fetch(`${API_URL}/api/contact`);
            const data = await response.json();
            if (data.success && data.contact) {
                document.getElementById('contactPhone').value = data.contact.phone || '';
                document.getElementById('contactEmail').value = data.contact.email || '';
                document.getElementById('contactAddress').value = data.contact.address || '';
                document.getElementById('contactHours').value = data.contact.hours || '';
            }
        } catch (error) { console.error('Error loading contact:', error); }
    }
    
    document.getElementById('contactForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const contact = {
            phone: document.getElementById('contactPhone').value,
            email: document.getElementById('contactEmail').value,
            address: document.getElementById('contactAddress').value,
            hours: document.getElementById('contactHours').value
        };
        try {
            const response = await fetch(`${API_URL}/api/admin/contact`, { 
                method: 'PUT', 
                headers: { 'Content-Type': 'application/json', 'X-Admin-Auth': authToken }, 
                body: JSON.stringify(contact) 
            });
            if (response.ok) {
                const msgDiv = document.getElementById('contactMessage');
                msgDiv.innerHTML = '<div class="success-msg">Contact info saved!</div>';
                setTimeout(() => msgDiv.innerHTML = '', 3000);
            }
        } catch (error) { alert('Error saving contact: ' + error.message); }
    });
    
    // ========== IMAGE PREVIEW ==========
    document.getElementById('imageUpload')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) { 
            const reader = new FileReader(); 
            reader.onload = (event) => { 
                document.getElementById('imagePreview').innerHTML = `<img src="${event.target.result}" class="image-preview">`; 
            }; 
            reader.readAsDataURL(file); 
        }
    });
    
    // ========== TAB SWITCHING ==========
    document.querySelectorAll('.tab').forEach(tab => { 
        tab.addEventListener('click', () => { 
            // Reset editing flag when switching tabs
            if (tab.dataset.tab !== 'add') {
                window.editingProductId = null;
                const submitBtn = document.querySelector('#addProductForm .btn-save');
                if (submitBtn) submitBtn.innerHTML = '<i class="fas fa-plus"></i> Add Product';
                document.getElementById('addProductForm')?.reset();
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('addMessage').innerHTML = '';
            }
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); 
            tab.classList.add('active'); 
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active')); 
            document.getElementById(`${tab.dataset.tab}Tab`).classList.add('active'); 
        }); 
    });
    
    // Initialize
    checkSession();
</script>
</body>
</html>
