<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scent Lovers - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0A0A0A; color: #FFFFFF; }
        
        .login-container { max-width: 420px; margin: 100px auto; background: #111; padding: 45px; border-radius: 28px; border: 1px solid #D4A853; text-align: center; }
        .login-container h2 { color: #D4A853; margin-bottom: 20px; font-family: 'Playfair Display', serif; }
        .login-container input { width: 100%; padding: 14px; margin: 12px 0; background: #1a1a1a; border: 1px solid #333; border-radius: 14px; color: white; font-size: 1rem; }
        .login-container button { width: 100%; padding: 14px; background: #D4A853; color: #000; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .login-container button:hover { background: #B8933F; transform: translateY(-2px); }
        
        .admin-container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 25px; border-bottom: 1px solid rgba(212,168,83,0.3); margin-bottom: 35px; flex-wrap: wrap; gap: 15px; }
        .admin-header h1 { color: #D4A853; font-family: 'Playfair Display', serif; font-size: 1.8rem; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 10px 24px; border-radius: 50px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .logout-btn:hover { background: #c0392b; transform: translateY(-2px); }
        
        .stats { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 30px; }
        .stat-card { background: #1a1a1a; padding: 15px 25px; border-radius: 16px; text-align: center; flex: 1; min-width: 100px; border: 1px solid #2a2a2a; }
        .stat-card .number { font-size: 2rem; font-weight: 700; color: #D4A853; }
        .stat-card .label { font-size: 0.75rem; color: #999; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; flex-wrap: wrap; }
        .tab { padding: 12px 24px; background: none; border: none; color: #999; cursor: pointer; border-radius: 40px; font-weight: 600; transition: 0.3s; }
        .tab:hover { color: #D4A853; }
        .tab.active { background: #D4A853; color: #000; }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 8px; color: #D4A853; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 14px; color: white; font-family: inherit; font-size: 0.95rem; }
        .btn-save { background: #D4A853; color: #000; border: none; padding: 14px 32px; border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-top: 10px; }
        .btn-save:hover { background: #B8933F; transform: translateY(-2px); }
        
        .product-grid { display: flex; flex-direction: column; gap: 12px; max-height: 600px; overflow-y: auto; }
        .product-card { background: #1a1a1a; border-radius: 16px; padding: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border: 1px solid #2a2a2a; }
        .product-card:hover { border-color: #D4A853; }
        .product-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; flex: 1; }
        .product-image { width: 50px; height: 50px; object-fit: cover; border-radius: 10px; background: #0d0d0d; }
        .product-details h4 { font-size: 1rem; margin-bottom: 4px; }
        .product-details p { font-size: 0.7rem; color: #999; }
        .product-price { color: #D4A853; font-weight: 700; min-width: 100px; }
        .product-actions { display: flex; gap: 10px; }
        .product-actions button { background: none; border: none; color: #D4A853; cursor: pointer; padding: 8px 12px; border-radius: 8px; }
        .product-actions button:hover { background: rgba(212,168,83,0.2); }
        .delete-btn { color: #e74c3c !important; }
        
        .image-preview { width: 100px; height: 100px; object-fit: cover; border-radius: 14px; margin-top: 12px; border: 2px solid #D4A853; }
        .success-msg { background: #27ae60; padding: 14px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .error-msg { background: #e74c3c; padding: 14px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        
        @media (max-width: 768px) { .admin-container { padding: 1rem; } .product-card { flex-direction: column; text-align: center; } .product-info { justify-content: center; } }
    </style>
</head>
<body>

<div id="app">
    <!-- Login Screen -->
    <div id="loginSection" class="login-container">
        <h2><i class="fas fa-crown"></i> Scent Lovers Admin</h2>
        <p style="color:#999; margin-bottom:25px;">Enter your credentials to manage all content</p>
        <input type="text" id="adminUsername" placeholder="Username" value="scentlovers">
        <input type="password" id="adminPassword" placeholder="Password" value="ScentLovers2026">
        <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
    </div>
    
    <!-- Dashboard -->
    <div id="dashboardSection" class="admin-container" style="display:none;">
        <div class="admin-header">
            <h1><i class="fas fa-crown"></i> Scent Lovers Admin</h1>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        
        <div class="stats" id="stats"></div>
        
        <div class="tabs">
            <button class="tab active" data-tab="products">📦 Products</button>
            <button class="tab" data-tab="add">➕ Add Product</button>
            <button class="tab" data-tab="settings">⚙️ Settings</button>
        </div>
        
        <!-- Products Tab -->
        <div id="productsTab" class="tab-content active">
            <div id="productsContainer" class="product-grid">
                <div style="text-align: center; padding: 40px;">Loading products...</div>
            </div>
        </div>
        
        <!-- Add Product Tab -->
        <div id="addTab" class="tab-content">
            <h3>Add New Product</h3>
            <div id="addMessage"></div>
            <form id="addProductForm">
                <div class="form-group"><label>Product Name *</label><input type="text" id="productName" required></div>
                <div class="form-group"><label>Brand *</label><input type="text" id="productBrand" required></div>
                <div class="form-group"><label>Price (ETB) *</label><input type="text" id="productPrice" required></div>
                <div class="form-group"><label>Category *</label>
                    <select id="productCategory">
                        <option value="women">👩 Women</option>
                        <option value="men">👨 Men</option>
                        <option value="gift">🎁 Gift Sets</option>
                        <option value="sale">🔥 Sale</option>
                    </select>
                </div>
                <div class="form-group"><label>Image URL</label><input type="text" id="productImage" placeholder="https://..."></div>
                <div class="form-group"><label>Tag (optional)</label><input type="text" id="productTag" placeholder="Bestseller, New, Sale"></div>
                <button type="submit" class="btn-save"><i class="fas fa-plus"></i> Add Product</button>
            </form>
        </div>
        
        <!-- Settings Tab -->
        <div id="settingsTab" class="tab-content">
            <h3>Site Settings</h3>
            <div id="settingsMessage"></div>
            <form id="settingsForm">
                <div class="form-group"><label>Hero Title</label><input type="text" id="heroTitle"></div>
                <div class="form-group"><label>Hero Subtitle</label><input type="text" id="heroSubtitle"></div>
                <div class="form-group"><label>Hero Description</label><textarea id="heroDesc" rows="2"></textarea></div>
                <div class="form-group"><label>Phone Number</label><input type="text" id="phoneNumber"></div>
                <div class="form-group"><label>Telegram Username</label><input type="text" id="telegramUsername"></div>
                <button type="submit" class="btn-save"><i class="fas fa-save"></i> Save Settings</button>
            </form>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://scent-lovers-api.developeraddis.workers.dev';
    let authToken = null;
    let allProducts = [];

    // Login
    document.getElementById('loginBtn')?.addEventListener('click', async () => {
        const username = document.getElementById('adminUsername').value;
        const password = document.getElementById('adminPassword').value;
        
        try {
            const response = await fetch(`${API_URL}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            
            if (data.success) {
                authToken = data.token;
                localStorage.setItem('adminToken', authToken);
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadAllData();
            } else {
                alert('Invalid credentials!');
            }
        } catch (error) {
            alert('Login error: ' + error.message);
        }
    });
    
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
        localStorage.removeItem('adminToken');
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('dashboardSection').style.display = 'none';
    });
    
    // Check saved session
    const savedToken = localStorage.getItem('adminToken');
    if (savedToken) {
        authToken = savedToken;
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        loadAllData();
    }
    
    async function loadAllData() {
        await loadProducts();
        await loadSettings();
    }
    
    async function loadProducts() {
        try {
            const response = await fetch(`${API_URL}/api/products`);
            const data = await response.json();
            console.log('API Response:', data);
            
            if (data.success) {
                // Parse products if it's a string
                let products = data.products;
                if (typeof products === 'string') {
                    products = JSON.parse(products);
                }
                allProducts = Array.isArray(products) ? products : [];
                renderProducts();
                renderStats();
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('productsContainer').innerHTML = '<div style="text-align: center; padding: 40px; color: #e74c3c;">Error loading products. Check console.</div>';
        }
    }
    
    function renderStats() {
        const women = allProducts.filter(p => p.category === 'women').length;
        const men = allProducts.filter(p => p.category === 'men').length;
        const gift = allProducts.filter(p => p.category === 'gift').length;
        const sale = allProducts.filter(p => p.category === 'sale').length;
        
        document.getElementById('stats').innerHTML = `
            <div class="stat-card"><div class="number">${women}</div><div class="label">Women</div></div>
            <div class="stat-card"><div class="number">${men}</div><div class="label">Men</div></div>
            <div class="stat-card"><div class="number">${gift}</div><div class="label">Gift</div></div>
            <div class="stat-card"><div class="number">${sale}</div><div class="label">Sale</div></div>
            <div class="stat-card"><div class="number">${allProducts.length}</div><div class="label">Total</div></div>
        `;
    }
    
    function renderProducts() {
        const container = document.getElementById('productsContainer');
        
        if (allProducts.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 40px;">No products found. Add your first product!</div>';
            return;
        }
        
        container.innerHTML = allProducts.map(product => `
            <div class="product-card">
                <div class="product-info">
                    ${product.image ? `<img src="${product.image}" class="product-image" onerror="this.src='https://via.placeholder.com/50x50'">` : '<div class="product-image" style="background:#2a2a2a; display:flex; align-items:center; justify-content:center;"><i class="fas fa-image"></i></div>'}
                    <div class="product-details">
                        <h4>${escapeHtml(product.brand)} - ${escapeHtml(product.name)}</h4>
                        <p>${product.category || 'Uncategorized'} | ID: ${product.id.substring(0, 8)}... ${product.tag ? '| ' + product.tag : ''}</p>
                    </div>
                    <div class="product-price">${product.price}</div>
                </div>
                <div class="product-actions">
                    <button onclick="editProduct('${product.id}')"><i class="fas fa-edit"></i> Edit</button>
                    <button onclick="deleteProduct('${product.id}')" class="delete-btn"><i class="fas fa-trash"></i> Delete</button>
                </div>
            </div>
        `).join('');
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    window.deleteProduct = async function(id) {
        if (!confirm('Delete this product?')) return;
        try {
            const response = await fetch(`${API_URL}/api/admin/products/${id}`, {
                method: 'DELETE',
                headers: { 'X-Admin-Auth': authToken }
            });
            if (response.ok) {
                alert('Product deleted!');
                await loadProducts();
            } else {
                alert('Delete failed');
            }
        } catch (error) {
            alert('Error: ' + error.message);
        }
    };
    
    window.editProduct = function(id) {
        const product = allProducts.find(p => p.id == id);
        if (product) {
            document.getElementById('productName').value = product.name || '';
            document.getElementById('productBrand').value = product.brand || '';
            document.getElementById('productPrice').value = (product.price || '').replace(' ETB', '');
            document.getElementById('productCategory').value = product.category || 'women';
            document.getElementById('productImage').value = product.image || '';
            document.getElementById('productTag').value = product.tag || '';
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector('.tab[data-tab="add"]').classList.add('active');
            document.getElementById('addTab').classList.add('active');
            window.editingProductId = id;
            document.querySelector('#addProductForm .btn-save').innerHTML = '<i class="fas fa-save"></i> Update Product';
        }
    };
    
    document.getElementById('addProductForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const messageDiv = document.getElementById('addMessage');
        
        const productData = {
            name: document.getElementById('productName').value,
            brand: document.getElementById('productBrand').value,
            price: document.getElementById('productPrice').value + ' ETB',
            category: document.getElementById('productCategory').value,
            image: document.getElementById('productImage').value,
            tag: document.getElementById('productTag').value
        };
        
        try {
            let response;
            if (window.editingProductId) {
                response = await fetch(`${API_URL}/api/admin/products/${window.editingProductId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Auth': authToken
                    },
                    body: JSON.stringify(productData)
                });
                delete window.editingProductId;
                messageDiv.innerHTML = '<div class="success-msg">Product updated!</div>';
                document.querySelector('#addProductForm .btn-save').innerHTML = '<i class="fas fa-plus"></i> Add Product';
            } else {
                response = await fetch(`${API_URL}/api/admin/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Auth': authToken
                    },
                    body: JSON.stringify(productData)
                });
                messageDiv.innerHTML = '<div class="success-msg">Product added!</div>';
            }
            
            if (response.ok) {
                e.target.reset();
                await loadProducts();
                setTimeout(() => messageDiv.innerHTML = '', 3000);
            }
        } catch (error) {
            messageDiv.innerHTML = `<div class="error-msg">Error: ${error.message}</div>`;
        }
    });
    
    async function loadSettings() {
        try {
            const response = await fetch(`${API_URL}/api/settings`);
            const data = await response.json();
            if (data.success && data.settings) {
                document.getElementById('heroTitle').value = data.settings.heroTitle || '';
                document.getElementById('heroSubtitle').value = data.settings.heroSubtitle || '';
                document.getElementById('heroDesc').value = data.settings.heroDesc || '';
                document.getElementById('phoneNumber').value = data.settings.phoneNumber || '';
                document.getElementById('telegramUsername').value = data.settings.telegramUsername || '';
            }
        } catch (error) { console.error('Error loading settings:', error); }
    }
    
    document.getElementById('settingsForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const settings = {
            heroTitle: document.getElementById('heroTitle').value,
            heroSubtitle: document.getElementById('heroSubtitle').value,
            heroDesc: document.getElementById('heroDesc').value,
            phoneNumber: document.getElementById('phoneNumber').value,
            telegramUsername: document.getElementById('telegramUsername').value
        };
        try {
            const response = await fetch(`${API_URL}/api/admin/settings`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Admin-Auth': authToken },
                body: JSON.stringify(settings)
            });
            if (response.ok) {
                const msgDiv = document.getElementById('settingsMessage');
                msgDiv.innerHTML = '<div class="success-msg">Settings saved!</div>';
                setTimeout(() => msgDiv.innerHTML = '', 3000);
            }
        } catch (error) { alert('Error: ' + error.message); }
    });
    
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tab.dataset.tab}Tab`).classList.add('active');
            
            // Reset add form when switching away
            if (tab.dataset.tab !== 'add') {
                window.editingProductId = null;
                document.querySelector('#addProductForm .btn-save').innerHTML = '<i class="fas fa-plus"></i> Add Product';
                document.getElementById('addProductForm')?.reset();
                document.getElementById('addMessage').innerHTML = '';
            }
        });
    });
</script>
</body>
</html>
