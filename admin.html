<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Scent Lovers</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        .login-box{background:#111;padding:40px;border-radius:15px;max-width:400px;margin:100px auto;text-align:center;border:1px solid #333}
        .login-box h2{color:#D4A853;margin-bottom:20px}
        .login-box input{width:100%;padding:14px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:1rem;text-align:center;margin-bottom:15px}
        .hidden{display:none!important}
        h1{color:#D4A853;margin-bottom:20px;font-size:1.8rem;text-align:center}
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}
        .stat{background:#111;padding:20px;border-radius:10px;text-align:center;border:1px solid #333}
        .stat .num{font-size:2rem;font-weight:800;color:#D4A853}
        .stat .lbl{font-size:0.75rem;color:#888;margin-top:5px}
        .card{background:#111;padding:25px;border-radius:12px;margin-bottom:25px;border:1px solid #333}
        h2{color:#D4A853;margin-bottom:18px;font-size:1.2rem}
        .row{display:flex;gap:12px;margin-bottom:12px}
        .row>*{flex:1}
        input,select,textarea{width:100%;padding:12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:0.95rem;margin-bottom:12px}
        button{padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:0.9rem}
        .btn-gold{background:#D4A853;color:#000}.btn-red{background:#c0392b;color:#fff}
        .btn-blue{background:#3498db;color:#fff}.btn-green{background:#27ae60;color:#fff}
        .btn-outline{background:transparent;border:1px solid #D4A853;color:#D4A853}
        .btn-logout{background:transparent;border:1px solid #c0392b;color:#c0392b}
        .upload-box{border:2px dashed #D4A853;padding:25px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:12px}
        .upload-box:hover{background:#1a1a1a}
        #preview,#editPreview{max-width:200px;display:none;margin:10px auto;border-radius:8px}
        #uploadStatus,#editUploadStatus{text-align:center;font-size:0.85rem;margin-bottom:10px}
        .msg{padding:12px;margin:10px 0;border-radius:8px;display:none;text-align:center;font-weight:600}
        .msg.success{background:#27ae60;display:block}.msg.error{background:#c0392b;display:block}
        .product-row{display:flex;align-items:center;gap:15px;padding:15px;background:#1a1a1a;border-radius:8px;margin-bottom:10px;border:1px solid #333}
        .product-row img{width:60px;height:60px;object-fit:cover;border-radius:8px}
        .product-row .info{flex:1}
        .product-row .info h3{color:#D4A853;margin-bottom:3px;font-size:0.95rem}
        .product-row .info p{color:#888;font-size:0.8rem}
        .edit-form{display:none;background:#1a1a1a;padding:20px;border-radius:8px;margin:10px 0;border:1px solid #D4A853}
        .edit-form.show{display:block}
        .search-box{width:100%;padding:12px 20px;background:#1a1a1a;border:2px solid #D4A853;border-radius:25px;color:#fff;font-size:0.95rem;margin-bottom:20px}
        .header-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
        @media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.row{flex-direction:column}}
    </style>
</head>
<body>
<div class="container">
    <div id="loginScreen" class="login-box">
        <h2>🔐 Admin Login</h2>
        <input type="password" id="passwordInput" placeholder="Enter Password" onkeypress="if(event.key==='Enter')login()">
        <button class="btn-gold" onclick="login()">Access Admin</button>
        <p id="loginError" style="color:#e74c3c;margin-top:10px;display:none;">❌ Wrong password</p>
    </div>
    
    <div id="adminPanel" class="hidden">
        <div class="header-row"><h1>🛍️ Admin Dashboard</h1><button class="btn-logout" onclick="logout()">🚪 Logout</button></div>
        
        <div class="stats">
            <div class="stat"><div class="num" id="statAll">0</div><div class="lbl">Total</div></div>
            <div class="stat"><div class="num" id="statWomen">0</div><div class="lbl">👩 Women</div></div>
            <div class="stat"><div class="num" id="statMen">0</div><div class="lbl">👨 Men</div></div>
            <div class="stat"><div class="num" id="statSale">0</div><div class="lbl">Gift+Sale</div></div>
        </div>
        
        <div class="card">
            <h2>➕ Add New Product</h2>
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <div style="font-size:40px;">📷</div><div>Click to Upload Image</div>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadNewImage()">
            <img id="preview"><div id="uploadStatus"></div><input type="hidden" id="uploadedImageUrl">
            <div class="row"><input type="text" id="name" placeholder="Product Name *"><input type="text" id="brand" placeholder="Brand *"></div>
            <div class="row"><input type="text" id="price" placeholder="Price (e.g. 4500 ETB) *">
                <select id="category"><option value="women">👩 Women</option><option value="men">👨 Men</option><option value="gift">🎁 Gift</option><option value="sale">🔥 Sale</option></select>
            </div>
            <div class="row"><input type="text" id="tag" placeholder="Tag"><input type="text" id="desc" placeholder="Description"></div>
            <button class="btn-gold" onclick="addProduct()">✅ Add Product</button>
            <div id="msg" class="msg"></div>
        </div>
        
        <div class="card">
            <div class="header-row"><h2>📋 Products</h2>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                    <button class="btn-outline" onclick="filterProds('all')">All</button>
                    <button class="btn-outline" onclick="filterProds('women')">Women</button>
                    <button class="btn-outline" onclick="filterProds('men')">Men</button>
                    <button class="btn-outline" onclick="filterProds('gift')">Gift</button>
                    <button class="btn-outline" onclick="filterProds('sale')">Sale</button>
                </div>
            </div>
            <input type="text" class="search-box" placeholder="🔍 Search..." id="searchInput" oninput="renderProducts()">
            
            <div id="editForm" class="edit-form">
                <h3 style="color:#D4A853;margin-bottom:10px;">✏️ Edit Product</h3>
                <input type="hidden" id="editId">
                <div class="upload-box" onclick="document.getElementById('editFileInput').click()">
                    <div style="font-size:30px;">📷</div><div>Click to Change Image</div>
                </div>
                <input type="file" id="editFileInput" accept="image/*" style="display:none" onchange="uploadEditImage()">
                <img id="editPreview"><div id="editUploadStatus"></div><input type="hidden" id="editImageUrl">
                <div class="row"><input type="text" id="editName" placeholder="Name"><input type="text" id="editBrand" placeholder="Brand"></div>
                <div class="row"><input type="text" id="editPrice" placeholder="Price">
                    <select id="editCategory"><option value="women">Women</option><option value="men">Men</option><option value="gift">Gift</option><option value="sale">Sale</option></select>
                </div>
                <div class="row"><input type="text" id="editTag" placeholder="Tag"><input type="text" id="editDesc" placeholder="Description"></div>
                <button class="btn-green" onclick="saveEdit()">💾 Save Changes</button>
                <button class="btn-red" onclick="cancelEdit()">Cancel</button>
            </div>
            
            <div id="productList"><p style="text-align:center;color:#888;padding:30px;">Loading...</p></div>
        </div>
    </div>
</div>

<script>
const API = 'https://scent-lovers-api.developeraddis.workers.dev/api/products';
const CLD = 'dm6rwo1ox';
const PRESET = 'scent_lovers_preset';
const PASS = 'ScentLovers2026';
let products = [], filter = 'all';

function login() {
    if(document.getElementById('passwordInput').value === PASS) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadProducts();
    } else { document.getElementById('loginError').style.display = 'block'; }
}
function logout() { document.getElementById('adminPanel').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); }

async function uploadToCloudinary(file, previewId, statusId, urlId) {
    const status = document.getElementById(statusId);
    status.textContent = '⏳ Uploading...'; status.style.color = '#D4A853';
    const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', PRESET);
    try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLD}/image/upload`, { method:'POST', body:fd });
        const data = await res.json();
        if(data.secure_url) {
            document.getElementById(urlId).value = data.secure_url;
            document.getElementById(previewId).src = data.secure_url;
            document.getElementById(previewId).style.display = 'block';
            status.textContent = '✅ Ready!'; status.style.color = '#27ae60';
        } else { status.textContent = '❌ Failed'; status.style.color = '#e74c3c'; }
    } catch(e) { status.textContent = '❌ Error'; status.style.color = '#e74c3c'; }
}

function uploadNewImage() { const f = document.getElementById('fileInput').files[0]; if(f) uploadToCloudinary(f, 'preview', 'uploadStatus', 'uploadedImageUrl'); }
function uploadEditImage() { const f = document.getElementById('editFileInput').files[0]; if(f) uploadToCloudinary(f, 'editPreview', 'editUploadStatus', 'editImageUrl'); }

async function loadProducts() {
    const res = await fetch(API); const data = await res.json();
    products = data.products || [];
    document.getElementById('statAll').textContent = products.length;
    document.getElementById('statWomen').textContent = products.filter(p => p.category==='women').length;
    document.getElementById('statMen').textContent = products.filter(p => p.category==='men').length;
    document.getElementById('statSale').textContent = products.filter(p => p.category==='gift'||p.category==='sale').length;
    renderProducts();
}

function renderProducts() {
    const s = (document.getElementById('searchInput')?.value||'').toLowerCase();
    let f = filter==='all' ? products : products.filter(p => p.category===filter);
    if(s) f = f.filter(p => p.name.toLowerCase().includes(s) || p.brand.toLowerCase().includes(s));
    const c = document.getElementById('productList');
    if(!f.length) { c.innerHTML = '<p style="text-align:center;color:#888;padding:30px;">No products</p>'; return; }
    c.innerHTML = f.map(p => `
        <div class="product-row">
            <img src="${p.image||'https://via.placeholder.com/60'}" onerror="this.src='https://via.placeholder.com/60'">
            <div class="info"><h3>${p.brand} - ${p.name}</h3><p>💰 ${p.price} | 📂 ${p.category} | 🏷️ ${p.tag||'-'}</p></div>
            <div style="display:flex;gap:8px"><button class="btn-blue" onclick="editProduct(${p.id})">✏️</button><button class="btn-red" onclick="deleteProduct(${p.id})">🗑️</button></div>
        </div>
    `).join('');
}
function filterProds(c) { filter = c; renderProducts(); }

async function addProduct() {
    const name = document.getElementById('name').value.trim();
    const brand = document.getElementById('brand').value.trim();
    const price = document.getElementById('price').value.trim();
    const category = document.getElementById('category').value;
    const image = document.getElementById('uploadedImageUrl').value;
    if(!name||!brand||!price) { showMsg('❌ Fill required fields','error'); return; }
    if(!image) { showMsg('❌ Upload image','error'); return; }
    
    await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name, brand, price:price.includes('ETB')?price:price+' ETB', category, image, tag:document.getElementById('tag').value, description:document.getElementById('desc').value })
    });
    showMsg('✅ Added!','success');
    ['name','brand','price','tag','desc'].forEach(id => document.getElementById(id).value='');
    document.getElementById('preview').style.display='none';
    document.getElementById('uploadedImageUrl').value='';
    document.getElementById('uploadStatus').textContent='';
    document.getElementById('fileInput').value='';
    loadProducts();
}

function editProduct(id) {
    const p = products.find(x => x.id == id); if(!p) return;
    document.getElementById('editId').value = p.id;
    document.getElementById('editName').value = p.name;
    document.getElementById('editBrand').value = p.brand;
    document.getElementById('editPrice').value = p.price.replace(' ETB','');
    document.getElementById('editCategory').value = p.category;
    document.getElementById('editTag').value = p.tag||'';
    document.getElementById('editDesc').value = p.description||'';
    document.getElementById('editImageUrl').value = p.image||'';
    if(p.image) { document.getElementById('editPreview').src = p.image; document.getElementById('editPreview').style.display = 'block'; }
    else { document.getElementById('editPreview').style.display = 'none'; }
    document.getElementById('editUploadStatus').textContent = '';
    document.getElementById('editFileInput').value = '';
    document.getElementById('editForm').classList.add('show');
    document.getElementById('editForm').scrollIntoView({behavior:'smooth'});
}
function cancelEdit() { document.getElementById('editForm').classList.remove('show'); }

async function saveEdit() {
    const id = document.getElementById('editId').value;
    const p = {
        name: document.getElementById('editName').value.trim(),
        brand: document.getElementById('editBrand').value.trim(),
        price: document.getElementById('editPrice').value.trim(),
        category: document.getElementById('editCategory').value,
        image: document.getElementById('editImageUrl').value,
        tag: document.getElementById('editTag').value.trim(),
        description: document.getElementById('editDesc').value.trim()
    };
    if(!p.name||!p.brand||!p.price) { showMsg('❌ Fill required fields','error'); return; }
    p.price = p.price.includes('ETB') ? p.price : p.price + ' ETB';
    
    const res = await fetch(`${API}/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p) });
    const data = await res.json();
    if(data.success) { showMsg('✅ Updated!','success'); cancelEdit(); loadProducts(); }
    else { showMsg('❌ Update failed: '+(data.error||''),'error'); }
}

async function deleteProduct(id) {
    if(!confirm('Delete this product?')) return;
    await fetch(`${API}/${id}`, { method:'DELETE' });
    loadProducts();
}

function showMsg(t, type) { const m = document.getElementById('msg'); m.textContent = t; m.className = `msg ${type}`; setTimeout(() => m.className='msg', 3000); }
</script>
</body>
</html>
