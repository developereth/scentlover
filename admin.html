<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Scent Lovers</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        h1{color:#D4A853;margin-bottom:25px;font-size:1.8rem;text-align:center}
        
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}
        .stat{background:#111;padding:20px;border-radius:10px;text-align:center;border:1px solid #333}
        .stat .num{font-size:2rem;font-weight:800;color:#D4A853}
        .stat .lbl{font-size:0.75rem;color:#888;margin-top:5px}
        
        .card{background:#111;padding:25px;border-radius:12px;margin-bottom:25px;border:1px solid #333}
        h2{color:#D4A853;margin-bottom:18px;font-size:1.2rem}
        .row{display:flex;gap:12px;margin-bottom:12px}
        .row>*{flex:1}
        input,select,textarea{width:100%;padding:12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:0.95rem;margin-bottom:12px}
        input:focus,select:focus,textarea:focus{outline:none;border-color:#D4A853}
        button{padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:0.9rem;transition:0.3s}
        .btn-gold{background:#D4A853;color:#000}
        .btn-gold:hover{background:#b8933f}
        .btn-red{background:#c0392b;color:#fff}
        .btn-red:hover{background:#e74c3c}
        .btn-blue{background:#3498db;color:#fff}
        .btn-green{background:#27ae60;color:#fff}
        .btn-outline{background:transparent;border:1px solid #D4A853;color:#D4A853}
        
        .upload-box{border:2px dashed #D4A853;padding:25px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:12px;transition:0.3s}
        .upload-box:hover{background:#1a1a1a;border-color:#fff}
        .upload-box.drag{background:#1a1a1a;border-color:#27ae60}
        #preview{max-width:200px;max-height:200px;display:none;margin:10px auto;border-radius:8px}
        #uploadStatus{text-align:center;font-size:0.85rem;margin-bottom:10px}
        
        .msg{padding:12px;margin:10px 0;border-radius:8px;display:none;text-align:center;font-weight:600}
        .msg.success{background:#27ae60;display:block}
        .msg.error{background:#c0392b;display:block}
        
        .product-row{display:flex;align-items:center;gap:15px;padding:15px;background:#1a1a1a;border-radius:8px;margin-bottom:10px;border:1px solid #333}
        .product-row img{width:60px;height:60px;object-fit:cover;border-radius:8px;flex-shrink:0}
        .product-row .info{flex:1;min-width:0}
        .product-row .info h3{color:#D4A853;margin-bottom:3px;font-size:0.95rem}
        .product-row .info p{color:#888;font-size:0.8rem}
        .product-row .actions{display:flex;gap:8px;flex-shrink:0}
        
        .search-box{width:100%;padding:12px 20px;background:#1a1a1a;border:2px solid #D4A853;border-radius:25px;color:#fff;font-size:0.95rem;margin-bottom:20px}
        
        @media(max-width:768px){
            .stats{grid-template-columns:repeat(2,1fr)}
            .product-row{flex-wrap:wrap}
            .product-row .actions{width:100%;justify-content:flex-end}
            .row{flex-direction:column}
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🛍️ Scent Lovers Admin</h1>
    
    <!-- Stats -->
    <div class="stats">
        <div class="stat"><div class="num" id="statAll">0</div><div class="lbl">Total</div></div>
        <div class="stat"><div class="num" id="statWomen">0</div><div class="lbl">👩 Women</div></div>
        <div class="stat"><div class="num" id="statMen">0</div><div class="lbl">👨 Men</div></div>
        <div class="stat"><div class="num" id="statSale">0</div><div class="lbl">Gift+Sale</div></div>
    </div>
    
    <!-- Add Product -->
    <div class="card">
        <h2>➕ Add New Product</h2>
        
        <div class="upload-box" onclick="document.getElementById('fileInput').click()" id="uploadBox">
            <div style="font-size:40px;">📷</div>
            <div>Click to Upload Product Image</div>
            <div style="font-size:0.75rem;color:#888;">JPG, PNG, or WEBP</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(event)">
        <img id="preview" alt="Preview">
        <div id="uploadStatus"></div>
        <input type="hidden" id="uploadedImageUrl">
        
        <div class="row">
            <input type="text" id="name" placeholder="Product Name *">
            <input type="text" id="brand" placeholder="Brand *">
        </div>
        <div class="row">
            <input type="text" id="price" placeholder="Price (e.g. 4500 ETB) *">
            <select id="category">
                <option value="women">👩 Women</option>
                <option value="men">👨 Men</option>
                <option value="gift">🎁 Gift Sets</option>
                <option value="sale">🔥 Sale</option>
            </select>
        </div>
        <div class="row">
            <input type="text" id="tag" placeholder="Tag: Bestseller, New...">
            <input type="text" id="desc" placeholder="Description">
        </div>
        <button class="btn-gold" onclick="addProduct()">✅ Add Product</button>
        <div id="msg" class="msg"></div>
    </div>
    
    <!-- Product List -->
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <h2 style="margin:0">📋 Products</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn-outline" onclick="filterProducts('all')">All</button>
                <button class="btn-outline" onclick="filterProducts('women')">Women</button>
                <button class="btn-outline" onclick="filterProducts('men')">Men</button>
                <button class="btn-outline" onclick="filterProducts('gift')">Gift</button>
                <button class="btn-outline" onclick="filterProducts('sale')">Sale</button>
            </div>
        </div>
        <input type="text" class="search-box" placeholder="🔍 Search products..." id="searchInput" oninput="renderProducts()">
        <div id="productList"><p style="text-align:center;color:#888;padding:30px;">Loading...</p></div>
    </div>
</div>

<script>
// ============ CONFIG ============
const API = 'https://scent-lovers-api.developeraddis.workers.dev/api/products';
const CLOUDINARY_CLOUD = 'dm6rwo1ox';
const CLOUDINARY_PRESET = 'scent_lovers_preset';

let allProducts = [];
let currentFilter = 'all';

// ============ IMAGE UPLOAD ============
function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    // Preview
    const reader = new FileReader();
    reader.onload = e => {
        document.getElementById('preview').src = e.target.result;
        document.getElementById('preview').style.display = 'block';
    };
    reader.readAsDataURL(file);
    
    // Upload to Cloudinary
    uploadToCloudinary(file);
}

async function uploadToCloudinary(file) {
    const status = document.getElementById('uploadStatus');
    status.textContent = '⏳ Uploading image...';
    status.style.color = '#D4A853';
    
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_PRESET);
    
    try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        
        if (data.secure_url) {
            document.getElementById('uploadedImageUrl').value = data.secure_url;
            status.textContent = '✅ Image uploaded!';
            status.style.color = '#27ae60';
        } else {
            status.textContent = '❌ Upload failed';
            status.style.color = '#e74c3c';
        }
    } catch(e) {
        status.textContent = '❌ Upload error';
        status.style.color = '#e74c3c';
    }
}

// Drag and drop
const uploadBox = document.getElementById('uploadBox');
uploadBox.addEventListener('dragover', e => { e.preventDefault(); uploadBox.classList.add('drag'); });
uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('drag'));
uploadBox.addEventListener('drop', e => {
    e.preventDefault();
    uploadBox.classList.remove('drag');
    const file = e.dataTransfer.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
            document.getElementById('preview').src = ev.target.result;
            document.getElementById('preview').style.display = 'block';
        };
        reader.readAsDataURL(file);
        uploadToCloudinary(file);
    }
});

// ============ PRODUCTS ============
async function loadProducts() {
    try {
        const res = await fetch(API);
        const data = await res.json();
        allProducts = data.products || [];
        updateStats();
        renderProducts();
    } catch(e) {
        document.getElementById('productList').innerHTML = '<p style="text-align:center;color:#e74c3c;padding:30px;">Error</p>';
    }
}

function updateStats() {
    document.getElementById('statAll').textContent = allProducts.length;
    document.getElementById('statWomen').textContent = allProducts.filter(p => p.category === 'women').length;
    document.getElementById('statMen').textContent = allProducts.filter(p => p.category === 'men').length;
    document.getElementById('statSale').textContent = allProducts.filter(p => p.category === 'gift' || p.category === 'sale').length;
}

function renderProducts() {
    const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
    let filtered = allProducts;
    
    if (currentFilter !== 'all') filtered = filtered.filter(p => p.category === currentFilter);
    if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search) || p.brand.toLowerCase().includes(search));
    
    const container = document.getElementById('productList');
    
    if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#888;padding:30px;">No products</p>';
        return;
    }
    
    container.innerHTML = filtered.map(p => `
        <div class="product-row">
            <img src="${p.image || 'https://via.placeholder.com/60'}" onerror="this.src='https://via.placeholder.com/60'">
            <div class="info">
                <h3>${p.brand} - ${p.name}</h3>
                <p>💰 ${p.price} | 📂 ${p.category} | 🏷️ ${p.tag || '-'}</p>
            </div>
            <div class="actions">
                <button class="btn-red" onclick="deleteProduct(${p.id})">🗑️</button>
            </div>
        </div>
    `).join('');
}

function filterProducts(cat) { currentFilter = cat; renderProducts(); }

// ============ ADD PRODUCT ============
async function addProduct() {
    const name = document.getElementById('name').value.trim();
    const brand = document.getElementById('brand').value.trim();
    const price = document.getElementById('price').value.trim();
    const category = document.getElementById('category').value;
    const image = document.getElementById('uploadedImageUrl').value;
    const tag = document.getElementById('tag').value.trim();
    const description = document.getElementById('desc').value.trim();
    
    if (!name || !brand || !price) { showMsg('❌ Fill required fields', 'error'); return; }
    if (!image) { showMsg('❌ Upload an image first', 'error'); return; }
    
    try {
        const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name, brand,
                price: price.includes('ETB') ? price : price + ' ETB',
                category, image, tag, description
            })
        });
        const data = await res.json();
        
        if (data.success) {
            showMsg('✅ Added!', 'success');
            ['name','brand','price','tag','desc'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('preview').style.display = 'none';
            document.getElementById('uploadedImageUrl').value = '';
            document.getElementById('uploadStatus').textContent = '';
            document.getElementById('fileInput').value = '';
            loadProducts();
        } else {
            showMsg('❌ Failed', 'error');
        }
    } catch(e) { showMsg('❌ Error', 'error'); }
}

// ============ DELETE ============
async function deleteProduct(id) {
    if (!confirm('Delete?')) return;
    await fetch(`${API}/${id}`, { method: 'DELETE' });
    loadProducts();
}

function showMsg(text, type) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = `msg ${type}`;
    setTimeout(() => msg.className = 'msg', 3000);
}

loadProducts();
</script>
</body>
</html>
