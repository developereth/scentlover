<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scent Lovers - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0A0A0A;
            color: #FFFFFF;
            line-height: 1.6;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: #111111;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #D4A853;
            text-align: center;
        }
        .login-container h2 {
            color: #D4A853;
            margin-bottom: 20px;
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #D4A853;
            color: #000;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(212,168,83,0.3);
            margin-bottom: 30px;
        }
        .admin-header h1 { color: #D4A853; }
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .tab {
            padding: 10px 25px;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            border-radius: 10px;
        }
        .tab.active {
            background: #D4A853;
            color: #000;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #D4A853;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-family: inherit;
        }
        .btn-save {
            background: #D4A853;
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        .product-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .product-item {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-info h4 { margin-bottom: 5px; }
        .product-info p { font-size: 0.8rem; color: #999; }
        .product-actions button {
            background: none;
            border: none;
            color: #D4A853;
            cursor: pointer;
            margin-left: 10px;
        }
        .delete-btn { color: #e74c3c !important; }
        .image-preview {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
        }
        .upload-progress {
            color: #D4A853;
            margin-top: 5px;
            font-size: 0.8rem;
        }
        .success-msg {
            background: #27ae60;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .error-msg {
            background: #e74c3c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        @media (max-width: 768px) {
            .admin-container { padding: 1rem; }
            .tabs { flex-wrap: wrap; }
            .product-item { flex-direction: column; text-align: center; gap: 10px; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- Login Form -->
    <div id="loginSection" class="login-container">
        <h2><i class="fas fa-crown"></i> Admin Login</h2>
        <p style="color:#999; margin-bottom:20px;">Enter your credentials to access the dashboard</p>
        <input type="text" id="adminUsername" placeholder="Username" value="scentlovers">
        <input type="password" id="adminPassword" placeholder="Password">
        <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
    </div>
    
    <!-- Admin Dashboard (hidden until login) -->
    <div id="dashboardSection" class="admin-container" style="display:none;">
        <div class="admin-header">
            <h1><i class="fas fa-crown"></i> Scent Lovers Admin</h1>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        
        <div class="tabs">
            <button class="tab active" data-tab="products">📦 Products</button>
            <button class="tab" data-tab="add">➕ Add Product</button>
            <button class="tab" data-tab="settings">⚙️ Site Settings</button>
        </div>
        
        <!-- Products Tab -->
        <div id="productsTab" class="tab-content active">
            <h3 style="margin-bottom:20px;">Manage Products</h3>
            <div id="productList" class="product-list"></div>
        </div>
        
        <!-- Add Product Tab -->
        <div id="addTab" class="tab-content">
            <h3 style="margin-bottom:20px;">Add New Product</h3>
            <div id="addMessage"></div>
            <form id="addProductForm">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label>Brand *</label>
                    <input type="text" id="productBrand" required>
                </div>
                <div class="form-group">
                    <label>Price (ETB) *</label>
                    <input type="text" id="productPrice" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="productCategory">
                        <option value="women">Women</option>
                        <option value="men">Men</option>
                        <option value="gift">Gift Sets</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Product Image</label>
                    <input type="file" id="imageUpload" accept="image/*">
                    <div id="uploadProgress" class="upload-progress" style="display:none;">Uploading to Cloudinary...</div>
                    <input type="text" id="productImageUrl" placeholder="Or enter image URL directly" style="margin-top:10px;">
                    <div id="imagePreview"></div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="productDesc" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-save"><i class="fas fa-plus"></i> Add Product</button>
            </form>
        </div>
        
        <!-- Settings Tab -->
        <div id="settingsTab" class="tab-content">
            <h3 style="margin-bottom:20px;">Site Settings</h3>
            <div id="settingsMessage"></div>
            <form id="settingsForm">
                <div class="form-group">
                    <label>Hero Title</label>
                    <input type="text" id="heroTitle">
                </div>
                <div class="form-group">
                    <label>Hero Subtitle</label>
                    <input type="text" id="heroSubtitle">
                </div>
                <div class="form-group">
                    <label>Hero Description</label>
                    <textarea id="heroDesc" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Hero Background Image URL</label>
                    <input type="text" id="heroBg">
                </div>
                <div class="form-group">
                    <label>Phone Number (for orders)</label>
                    <input type="text" id="phoneNumber">
                </div>
                <div class="form-group">
                    <label>Telegram Username</label>
                    <input type="text" id="telegramUsername">
                </div>
                <div class="form-group">
                    <label>WhatsApp Number</label>
                    <input type="text" id="whatsappNumber">
                </div>
                <button type="submit" class="btn-save"><i class="fas fa-save"></i> Save Settings</button>
            </form>
        </div>
    </div>
</div>

<script>
    // Configuration
    const API_URL = 'https://your-worker.your-subdomain.workers.dev';
    const CLOUDINARY_CLOUD_NAME = 'your-cloud-name'; // Replace with your Cloudinary cloud name
    const CLOUDINARY_UPLOAD_PRESET = 'scent_lovers_preset'; // Create this in Cloudinary
    
    let authToken = null;
    let products = [];
    
    // Check for existing session
    function checkSession() {
        const savedToken = localStorage.getItem('adminToken');
        if (savedToken) {
            authToken = savedToken;
            verifyAndLoadDashboard();
        }
    }
    
    async function verifyAndLoadDashboard() {
        try {
            const response = await fetch(`${API_URL}/api/admin/verify`, {
                headers: { 'X-Admin-Auth': authToken }
            });
            if (response.ok) {
                showDashboard();
                loadProducts();
                loadSettings();
            } else {
                showLogin();
            }
        } catch {
            showLogin();
        }
    }
    
    function showLogin() {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('dashboardSection').style.display = 'none';
        localStorage.removeItem('adminToken');
        authToken = null;
    }
    
    function showDashboard() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
    }
    
    // Login
    document.getElementById('loginBtn')?.addEventListener('click', async () => {
        const username = document.getElementById('adminUsername').value;
        const password = document.getElementById('adminPassword').value;
        
        try {
            const response = await fetch(`${API_URL}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            if (data.success) {
                authToken = data.token;
                localStorage.setItem('adminToken', authToken);
                showDashboard();
                loadProducts();
                loadSettings();
            } else {
                alert('Invalid credentials!');
            }
        } catch (error) {
            alert('Login error: ' + error.message);
        }
    });
    
    // Logout
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
        showLogin();
    });
    
    // Load products
    async function loadProducts() {
        try {
            const response = await fetch(`${API_URL}/api/products`);
            const data = await response.json();
            if (data.success) {
                products = data.products;
                renderProductList();
            }
        } catch (error) {
            console.error('Error loading products:', error);
        }
    }
    
    function renderProductList() {
        const container = document.getElementById('productList');
        if (!container) return;
        
        if (products.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#999;">No products yet. Add your first product!</p>';
            return;
        }
        
        container.innerHTML = products.map(product => `
            <div class="product-item">
                <div class="product-info">
                    <h4>${product.brand} - ${product.name}</h4>
                    <p>${product.price} | ${product.category || 'Uncategorized'}</p>
                </div>
                <div class="product-actions">
                    <button onclick="editProduct('${product.id}')"><i class="fas fa-edit"></i> Edit</button>
                    <button onclick="deleteProduct('${product.id}')" class="delete-btn"><i class="fas fa-trash"></i> Delete</button>
                </div>
            </div>
        `).join('');
    }
    
    // Delete product
    window.deleteProduct = async function(id) {
        if (!confirm('Are you sure you want to delete this product?')) return;
        try {
            const response = await fetch(`${API_URL}/api/admin/products/${id}`, {
                method: 'DELETE',
                headers: { 'X-Admin-Auth': authToken }
            });
            if (response.ok) {
                alert('Product deleted!');
                loadProducts();
            } else {
                alert('Delete failed');
            }
        } catch (error) {
            alert('Error: ' + error.message);
        }
    };
    
    // Edit product
    window.editProduct = function(id) {
        const product = products.find(p => p.id == id);
        if (product) {
            document.getElementById('productName').value = product.name;
            document.getElementById('productBrand').value = product.brand;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productCategory').value = product.category || 'women';
            document.getElementById('productDesc').value = product.description || '';
            document.getElementById('productImageUrl').value = product.image || '';
            
            // Switch to add tab
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector('.tab[data-tab="add"]').classList.add('active');
            document.getElementById('addTab').classList.add('active');
            
            // Store edit mode
            window.editingProductId = id;
        }
    };
    
    // Upload to Cloudinary
    async function uploadToCloudinary(file) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
        
        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
            method: 'POST',
            body: formData
        });
        const data = await response.json();
        return data.secure_url;
    }
    
    // Add/Update product
    document.getElementById('addProductForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const progressDiv = document.getElementById('uploadProgress');
        const messageDiv = document.getElementById('addMessage');
        
        let imageUrl = document.getElementById('productImageUrl').value;
        const imageFile = document.getElementById('imageUpload').files[0];
        
        if (imageFile) {
            progressDiv.style.display = 'block';
            try {
                imageUrl = await uploadToCloudinary(imageFile);
                progressDiv.style.display = 'none';
            } catch (error) {
                progressDiv.style.display = 'none';
                messageDiv.innerHTML = '<div class="error-msg">Image upload failed!</div>';
                return;
            }
        }
        
        const productData = {
            name: document.getElementById('productName').value,
            brand: document.getElementById('productBrand').value,
            price: document.getElementById('productPrice').value,
            category: document.getElementById('productCategory').value,
            image: imageUrl,
            description: document.getElementById('productDesc').value
        };
        
        try {
            let response;
            if (window.editingProductId) {
                response = await fetch(`${API_URL}/api/admin/products/${window.editingProductId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Auth': authToken
                    },
                    body: JSON.stringify(productData)
                });
                delete window.editingProductId;
                messageDiv.innerHTML = '<div class="success-msg">Product updated successfully!</div>';
            } else {
                response = await fetch(`${API_URL}/api/admin/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Auth': authToken
                    },
                    body: JSON.stringify(productData)
                });
                messageDiv.innerHTML = '<div class="success-msg">Product added successfully!</div>';
            }
            
            if (response.ok) {
                e.target.reset();
                document.getElementById('imagePreview').innerHTML = '';
                loadProducts();
                setTimeout(() => { messageDiv.innerHTML = ''; }, 3000);
            }
        } catch (error) {
            messageDiv.innerHTML = `<div class="error-msg">Error: ${error.message}</div>`;
        }
    });
    
    // Load settings
    async function loadSettings() {
        try {
            const response = await fetch(`${API_URL}/api/settings`);
            const data = await response.json();
            if (data.success) {
                const s = data.settings;
                document.getElementById('heroTitle').value = s.heroTitle || '';
                document.getElementById('heroSubtitle').value = s.heroSubtitle || '';
                document.getElementById('heroDesc').value = s.heroDesc || '';
                document.getElementById('heroBg').value = s.heroBg || '';
                document.getElementById('phoneNumber').value = s.phoneNumber || '';
                document.getElementById('telegramUsername').value = s.telegramUsername || '';
                document.getElementById('whatsappNumber').value = s.whatsappNumber || '';
            }
        } catch (error) {
            console.error('Error loading settings:', error);
        }
    }
    
    // Save settings
    document.getElementById('settingsForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const settings = {
            heroTitle: document.getElementById('heroTitle').value,
            heroSubtitle: document.getElementById('heroSubtitle').value,
            heroDesc: document.getElementById('heroDesc').value,
            heroBg: document.getElementById('heroBg').value,
            phoneNumber: document.getElementById('phoneNumber').value,
            telegramUsername: document.getElementById('telegramUsername').value,
            whatsappNumber: document.getElementById('whatsappNumber').value
        };
        
        try {
            const response = await fetch(`${API_URL}/api/admin/settings`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Auth': authToken
                },
                body: JSON.stringify(settings)
            });
            if (response.ok) {
                const msgDiv = document.getElementById('settingsMessage');
                msgDiv.innerHTML = '<div class="success-msg">Settings saved successfully!</div>';
                setTimeout(() => { msgDiv.innerHTML = ''; }, 3000);
            }
        } catch (error) {
            alert('Error saving settings: ' + error.message);
        }
    });
    
    // Image preview
    document.getElementById('imageUpload')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('imagePreview').innerHTML = `<img src="${event.target.result}" class="image-preview">`;
            };
            reader.readAsDataURL(file);
        }
    });
    
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tab.dataset.tab}Tab`).classList.add('active');
        });
    });
    
    // Initialize
    checkSession();
</script>
</body>
</html>
