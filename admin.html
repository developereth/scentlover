<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Scent Lovers</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        h1{color:#D4A853;margin-bottom:25px;font-size:1.8rem;text-align:center}
        
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}
        .stat{background:#111;padding:20px;border-radius:10px;text-align:center;border:1px solid #333}
        .stat .num{font-size:2rem;font-weight:800;color:#D4A853}
        .stat .lbl{font-size:0.75rem;color:#888;margin-top:5px}
        
        .card{background:#111;padding:25px;border-radius:12px;margin-bottom:25px;border:1px solid #333}
        h2{color:#D4A853;margin-bottom:18px;font-size:1.2rem}
        .row{display:flex;gap:12px;margin-bottom:12px}
        .row>*{flex:1}
        input,select,textarea{width:100%;padding:12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:0.95rem;margin-bottom:12px}
        input:focus,select:focus,textarea:focus{outline:none;border-color:#D4A853}
        button{padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:0.9rem;transition:0.3s}
        .btn-gold{background:#D4A853;color:#000}
        .btn-gold:hover{background:#b8933f}
        .btn-red{background:#c0392b;color:#fff}
        .btn-red:hover{background:#e74c3c}
        .btn-blue{background:#3498db;color:#fff}
        .btn-green{background:#27ae60;color:#fff}
        .btn-outline{background:transparent;border:1px solid #D4A853;color:#D4A853}
        
        .msg{padding:12px;margin:10px 0;border-radius:8px;display:none;text-align:center;font-weight:600}
        .msg.success{background:#27ae60;display:block}
        .msg.error{background:#c0392b;display:block}
        
        .product-row{display:flex;align-items:center;gap:15px;padding:15px;background:#1a1a1a;border-radius:8px;margin-bottom:10px;border:1px solid #333}
        .product-row img{width:60px;height:60px;object-fit:cover;border-radius:8px;flex-shrink:0}
        .product-row .info{flex:1;min-width:0}
        .product-row .info h3{color:#D4A853;margin-bottom:3px;font-size:0.95rem}
        .product-row .info p{color:#888;font-size:0.8rem}
        .product-row .actions{display:flex;gap:8px;flex-shrink:0}
        
        .edit-form{display:none;background:#1a1a1a;padding:20px;border-radius:8px;margin:10px 0 20px 0;border:1px solid #D4A853}
        .edit-form.show{display:block}
        
        .search-box{width:100%;padding:12px 20px;background:#1a1a1a;border:2px solid #D4A853;border-radius:25px;color:#fff;font-size:0.95rem;margin-bottom:20px}
        
        @media(max-width:768px){
            .stats{grid-template-columns:repeat(2,1fr)}
            .product-row{flex-wrap:wrap}
            .product-row .actions{width:100%;justify-content:flex-end}
            .row{flex-direction:column}
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🛍️ Scent Lovers Admin</h1>
    
    <!-- Stats -->
    <div class="stats">
        <div class="stat"><div class="num" id="statAll">0</div><div class="lbl">Total Products</div></div>
        <div class="stat"><div class="num" id="statWomen">0</div><div class="lbl">👩 Women</div></div>
        <div class="stat"><div class="num" id="statMen">0</div><div class="lbl">👨 Men</div></div>
        <div class="stat"><div class="num" id="statSale">0</div><div class="lbl">Gift + Sale</div></div>
    </div>
    
    <!-- Add Product Form -->
    <div class="card">
        <h2>➕ Add New Product</h2>
        <div class="row">
            <input type="text" id="name" placeholder="Product Name *">
            <input type="text" id="brand" placeholder="Brand *">
        </div>
        <div class="row">
            <input type="text" id="price" placeholder="Price (e.g. 4500 ETB) *">
            <select id="category">
                <option value="women">👩 Women's Perfumes</option>
                <option value="men">👨 Men's Colognes</option>
                <option value="gift">🎁 Gift Sets</option>
                <option value="sale">🔥 Sale / Offers</option>
            </select>
        </div>
        <input type="text" id="image" placeholder="Image URL (Cloudinary or image link)">
        <div class="row">
            <input type="text" id="tag" placeholder="Tag: Bestseller, New, Sale...">
            <input type="text" id="desc" placeholder="Description (optional)">
        </div>
        <button class="btn-gold" onclick="addProduct()">✅ Add Product</button>
        <div id="msg" class="msg"></div>
    </div>
    
    <!-- Product List -->
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <h2 style="margin:0">📋 All Products</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn-outline" onclick="filterProducts('all')">All</button>
                <button class="btn-outline" onclick="filterProducts('women')">Women</button>
                <button class="btn-outline" onclick="filterProducts('men')">Men</button>
                <button class="btn-outline" onclick="filterProducts('gift')">Gift</button>
                <button class="btn-outline" onclick="filterProducts('sale')">Sale</button>
            </div>
        </div>
        <input type="text" class="search-box" placeholder="🔍 Search products..." oninput="searchProducts()" id="searchInput">
        
        <div id="editForm" class="edit-form">
            <h3 style="color:#D4A853;margin-bottom:15px;">✏️ Edit Product</h3>
            <input type="hidden" id="editId">
            <div class="row">
                <input type="text" id="editName" placeholder="Product Name">
                <input type="text" id="editBrand" placeholder="Brand">
            </div>
            <div class="row">
                <input type="text" id="editPrice" placeholder="Price">
                <select id="editCategory">
                    <option value="women">Women</option>
                    <option value="men">Men</option>
                    <option value="gift">Gift Sets</option>
                    <option value="sale">Sale</option>
                </select>
            </div>
            <input type="text" id="editImage" placeholder="Image URL">
            <div class="row">
                <input type="text" id="editTag" placeholder="Tag">
                <input type="text" id="editDesc" placeholder="Description">
            </div>
            <button class="btn-green" onclick="saveEdit()">💾 Save Changes</button>
            <button class="btn-red" onclick="cancelEdit()">Cancel</button>
        </div>
        
        <div id="productList">
            <p style="text-align:center;color:#888;padding:30px;">Loading products...</p>
        </div>
    </div>
</div>

<script>
const API = 'https://scent-lovers-api.developeraddis.workers.dev/api/products';
let allProducts = [];
let currentFilter = 'all';

async function loadProducts() {
    try {
        const res = await fetch(API);
        const data = await res.json();
        allProducts = data.products || [];
        updateStats();
        renderProducts();
    } catch(e) {
        document.getElementById('productList').innerHTML = '<p style="text-align:center;color:#e74c3c;padding:30px;">Error loading products</p>';
    }
}

function updateStats() {
    document.getElementById('statAll').textContent = allProducts.length;
    document.getElementById('statWomen').textContent = allProducts.filter(p => p.category === 'women').length;
    document.getElementById('statMen').textContent = allProducts.filter(p => p.category === 'men').length;
    document.getElementById('statSale').textContent = allProducts.filter(p => p.category === 'gift' || p.category === 'sale').length;
}

function renderProducts() {
    const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
    let filtered = allProducts;
    
    if (currentFilter !== 'all') {
        filtered = filtered.filter(p => p.category === currentFilter);
    }
    if (search) {
        filtered = filtered.filter(p => 
            p.name.toLowerCase().includes(search) || 
            p.brand.toLowerCase().includes(search)
        );
    }
    
    const container = document.getElementById('productList');
    
    if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#888;padding:30px;">No products found</p>';
        return;
    }
    
    container.innerHTML = filtered.map(p => `
        <div class="product-row">
            <img src="${p.image || 'https://via.placeholder.com/60'}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/60'">
            <div class="info">
                <h3>${p.brand} - ${p.name}</h3>
                <p>💰 ${p.price} | 📂 ${p.category} | 🏷️ ${p.tag || 'No tag'} | 🕐 ${new Date(p.created_at).toLocaleDateString()}</p>
            </div>
            <div class="actions">
                <button class="btn-blue" onclick="editProduct(${p.id})">✏️</button>
                <button class="btn-red" onclick="deleteProduct(${p.id})">🗑️</button>
            </div>
        </div>
    `).join('');
}

function filterProducts(cat) {
    currentFilter = cat;
    renderProducts();
}

function searchProducts() {
    renderProducts();
}

async function addProduct() {
    const name = document.getElementById('name').value.trim();
    const brand = document.getElementById('brand').value.trim();
    const price = document.getElementById('price').value.trim();
    const category = document.getElementById('category').value;
    const image = document.getElementById('image').value.trim();
    const tag = document.getElementById('tag').value.trim();
    const description = document.getElementById('desc').value.trim();
    
    if (!name || !brand || !price) {
        showMsg('❌ Name, Brand, and Price are required', 'error');
        return;
    }
    
    try {
        const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name, brand,
                price: price.includes('ETB') ? price : price + ' ETB',
                category, image, tag, description
            })
        });
        const data = await res.json();
        
        if (data.success) {
            showMsg('✅ Product added successfully!', 'success');
            ['name','brand','price','image','tag','desc'].forEach(id => document.getElementById(id).value = '');
            loadProducts();
        } else {
            showMsg('❌ Failed to add product', 'error');
        }
    } catch(e) {
        showMsg('❌ Connection error', 'error');
    }
}

function editProduct(id) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    
    document.getElementById('editId').value = product.id;
    document.getElementById('editName').value = product.name;
    document.getElementById('editBrand').value = product.brand;
    document.getElementById('editPrice').value = product.price.replace(' ETB', '');
    document.getElementById('editCategory').value = product.category;
    document.getElementById('editImage').value = product.image || '';
    document.getElementById('editTag').value = product.tag || '';
    document.getElementById('editDesc').value = product.description || '';
    
    document.getElementById('editForm').classList.add('show');
    document.getElementById('editForm').scrollIntoView({ behavior: 'smooth' });
}

function cancelEdit() {
    document.getElementById('editForm').classList.remove('show');
}

async function saveEdit() {
    const id = document.getElementById('editId').value;
    const product = {
        name: document.getElementById('editName').value.trim(),
        brand: document.getElementById('editBrand').value.trim(),
        price: document.getElementById('editPrice').value.trim(),
        category: document.getElementById('editCategory').value,
        image: document.getElementById('editImage').value.trim(),
        tag: document.getElementById('editTag').value.trim(),
        description: document.getElementById('editDesc').value.trim()
    };
    
    if (!product.name || !product.brand || !product.price) {
        showMsg('❌ Name, Brand, and Price are required', 'error');
        return;
    }
    
    product.price = product.price.includes('ETB') ? product.price : product.price + ' ETB';
    
    try {
        const res = await fetch(`${API}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(product)
        });
        const data = await res.json();
        
        if (data.success) {
            showMsg('✅ Product updated!', 'success');
            cancelEdit();
            loadProducts();
        } else {
            showMsg('❌ Failed to update', 'error');
        }
    } catch(e) {
        showMsg('❌ Connection error', 'error');
    }
}

async function deleteProduct(id) {
    if (!confirm('Are you sure you want to delete this product?')) return;
    
    try {
        await fetch(`${API}/${id}`, { method: 'DELETE' });
        showMsg('✅ Product deleted', 'success');
        loadProducts();
    } catch(e) {
        showMsg('❌ Error deleting', 'error');
    }
}

function showMsg(text, type) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = `msg ${type}`;
    setTimeout(() => { msg.className = 'msg'; }, 3000);
}

// Load on page open
loadProducts();
</script>
</body>
</html>
