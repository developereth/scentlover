<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Inter', monospace;
            background: #0A0A0A;
            color: #FFFFFF;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #111;
            border-radius: 24px;
            padding: 30px;
            border: 1px solid #D4A853;
        }
        h1 {
            color: #D4A853;
            font-family: 'Playfair Display', serif;
            margin-bottom: 10px;
        }
        .status {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
        .info { color: #D4A853; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #D4A853;
            transition: width 0.3s ease;
        }
        button {
            background: #D4A853;
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            background: #B8933F;
            transform: translateY(-2px);
        }
        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }
        .stat {
            text-align: center;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 16px;
            flex: 1;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #D4A853;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📦 Scent Lovers - Product Importer</h1>
    <p>This will add ALL 35 products to your database (Women, Men, Gift Sets, Offers).</p>
    
    <div class="stats" id="stats" style="display: none;">
        <div class="stat"><div class="stat-number" id="statWomen">0</div><div class="stat-label">Women</div></div>
        <div class="stat"><div class="stat-number" id="statMen">0</div><div class="stat-label">Men</div></div>
        <div class="stat"><div class="stat-number" id="statGift">0</div><div class="stat-label">Gift</div></div>
        <div class="stat"><div class="stat-number" id="statSale">0</div><div class="stat-label">Sale</div></div>
        <div class="stat"><div class="stat-number" id="statTotal">0</div><div class="stat-label">Total</div></div>
    </div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="status" id="log">
        <span class="info">⚡ Ready to import. Click "Start Import" below.</span>
    </div>
    
    <button id="importBtn">🚀 Start Import (All 35 Products)</button>
</div>

    // ========== ALL 35 PRODUCTS ==========

        // ===== WOMEN'S PRODUCTS (11) =====

        { name: "Peony Paradise", brand: "Armani", price: "8,900 ETB", category: "women", image: "https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?w=400" },

        { name: "Citrus Bloom", brand: "Creed", price: "14,200 ETB", category: "women", image: "https://images.unsplash.com/photo-1595425970377-c9703cf48b6d?w=400" },
        { name: "Gardenia Touch", brand: "Chanel", price: "9,500 ETB", category: "women", image: "https://images.unsplash.com/photo-1560343090-f0409e92791a?w=400" },
        
        // ===== MEN'S PRODUCTS (12) =====
        { name: "Midnight Woods", brand: "Tom Ford", price: "12,000 ETB", category: "men", image: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=400", tag: "Bestseller" },
        { name: "Ocean Breeze", brand: "Armani", price: "7,200 ETB", category: "men", image: "https://images.unsplash.com/photo-1595425970377-c9703cf48b6d?w=400" },
        { name: "Leather & Spice", brand: "Creed", price: "14,500 ETB", category: "men", image: "https://images.unsplash.com/photo-1563170351-be82bc888aa4?w=400", tag: "New" },
        { name: "Sandalwood Hero", brand: "Dior", price: "9,800 ETB", category: "men", image: "https://images.unsplash.com/photo-1587017539504-67cfbddac569?w=400" },
        { name: "Citrus Storm", brand: "Chanel", price: "8,500 ETB", category: "men", image: "https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?w=400" },
        { name: "Amber Fire", brand: "Tom Ford", price: "13,200 ETB", category: "men", image: "https://images.unsplash.com/photo-1547887538-e3a2f32cb1cc?w=400" },
        { name: "Cedar Essence", brand: "Armani", price: "6,000 ETB", category: "men", image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400", tag: "Sale" },
        { name: "Black Pepper", brand: "Creed", price: "15,000 ETB", category: "men", image: "https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=400" },
        { name: "Vetiver Green", brand: "Dior", price: "10,500 ETB", category: "men", image: "https://images.unsplash.com/photo-1557170330-49139a15ccea?w=400" },
        { name: "Musk Legend", brand: "Tom Ford", price: "11,800 ETB", category: "men", image: "https://images.unsplash.com/photo-1560343090-f0409e92791a?w=400" },
        { name: "Sea Salt", brand: "Chanel", price: "8,900 ETB", category: "men", image: "https://images.unsplash.com/photo-1594035910387-fea4773a0e6e?w=400" },
        { name: "Oud Supreme", brand: "Creed", price: "16,500 ETB", category: "men", image: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=400" },
        
        // ===== GIFT SETS (6) =====
        { name: "Luxury Collection Box", brand: "Scent Lovers Exclusive", price: "18,500 ETB", category: "gift", image: "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=400", tag: "Holiday Special", description: "5 x 10ml Signature Scents" },
        { name: "His & Hers Duo", brand: "Tom Ford + Chanel", price: "22,000 ETB", category: "gift", image: "https://images.unsplash.com/photo-1595425970377-c9703cf48b6d?w=400", tag: "Popular", description: "2 x 50ml — Midnight Woods & Rose Elegance" },
        { name: "Miniature Discovery Set", brand: "Multi-Brand", price: "12,000 ETB", category: "gift", image: "https://images.unsplash.com/photo-1587017539504-67cfbddac569?w=400", description: "8 x 5ml Best-Selling Scents" },
        { name: "Wedding Day Collection", brand: "Creed + Dior", price: "28,000 ETB", category: "gift", image: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=400", tag: "Wedding", description: "2 x 100ml — Velvet Oud & Sandalwood Hero" },
        { name: "Anniversary Bundle", brand: "Armani", price: "15,800 ETB", category: "gift", image: "https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?w=400", description: "3 x 30ml — His & Hers Favorites" },
        { name: "Deluxe Gift Hamper", brand: "Scent Lovers Exclusive", price: "25,000 ETB", category: "gift", image: "https://images.unsplash.com/photo-1563170351-be82bc888aa4?w=400", tag: "Premium", description: "Full-size + body lotion + candle" },
        
        // ===== OFFERS / SALE (6) =====
        { name: "Vanilla Orchid", brand: "Dior", price: "6,500 ETB", category: "sale", image: "https://images.unsplash.com/photo-1587017539504-67cfbddac569?w=400", tag: "40% OFF" },
        { name: "Cedar Essence", brand: "Armani", price: "6,000 ETB", category: "sale", image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400", tag: "30% OFF" },
        { name: "Lavender Mist", brand: "Chanel", price: "5,850 ETB", category: "sale", image: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=400", tag: "25% OFF" },
        { name: "His & Hers Duo", brand: "Tom Ford + Chanel", price: "22,000 ETB", category: "sale", image: "https://images.unsplash.com/photo-1595425970377-c9703cf48b6d?w=400", tag: "20% OFF" },
        { name: "Ocean Breeze", brand: "Armani", price: "6,120 ETB", category: "sale", image: "https://images.unsplash.com/photo-1563170351-be82bc888aa4?w=400", tag: "15% OFF" },
        { name: "Citrus Storm", brand: "Chanel", price: "7,650 ETB", category: "sale", image: "https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?w=400", tag: "10% OFF" }
    ];
    
    let authToken = null;
    
    function log(message, type = 'info') {
        const logDiv = document.getElementById('log');
        const color = type === 'success' ? '#27ae60' : (type === 'error' ? '#e74c3c' : '#D4A853');
        logDiv.innerHTML += `<div style="color: ${color}; margin-bottom: 5px;">${message}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }
    
    async function login() {
        log('🔐 Logging in...', 'info');
        try {
            const response = await fetch(`${API_URL}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: USERNAME, password: PASSWORD })
            });
            const data = await response.json();
            if (data.success) {
                log('✅ Login successful!', 'success');
                return data.token;
            } else {
                throw new Error('Login failed');
            }
        } catch (error) {
            log(`❌ Login error: ${error.message}`, 'error');
            return null;
        }
    }
    
    async function addProduct(product, index, total) {
        try {
            const response = await fetch(`${API_URL}/api/admin/products`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Auth': authToken
                },
                body: JSON.stringify(product)
            });
            const data = await response.json();
            return data.success;
        } catch (error) {
            console.error('Error adding product:', error);
            return false;
        }
    }
    
    function updateStats() {
        const stats = { women: 0, men: 0, gift: 0, sale: 0 };
        ALL_PRODUCTS.forEach(p => {
            if (p.category === 'women') stats.women++;
            else if (p.category === 'men') stats.men++;
            else if (p.category === 'gift') stats.gift++;
            else if (p.category === 'sale') stats.sale++;
        });
        document.getElementById('statWomen').textContent = stats.women;
        document.getElementById('statMen').textContent = stats.men;
        document.getElementById('statGift').textContent = stats.gift;
        document.getElementById('statSale').textContent = stats.sale;
        document.getElementById('statTotal').textContent = ALL_PRODUCTS.length;
        document.getElementById('stats').style.display = 'flex';
    }
    
    async function startImport() {
        const btn = document.getElementById('importBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Importing... Please wait';
        
        document.getElementById('log').innerHTML = '';
        updateStats();
        
        log('🚀 Starting import of ' + ALL_PRODUCTS.length + ' products...', 'info');
        log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
        
        // Login first
        authToken = await login();
        if (!authToken) {
            log('❌ Cannot proceed without login. Check your credentials.', 'error');
            btn.disabled = false;
            btn.textContent = '🚀 Start Import (All 35 Products)';
            return;
        }
        
        let successCount = 0;
        let failCount = 0;
        
        for (let i = 0; i < ALL_PRODUCTS.length; i++) {
            const product = ALL_PRODUCTS[i];
            const progress = ((i + 1) / ALL_PRODUCTS.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            
            const success = await addProduct(product, i, ALL_PRODUCTS.length);
            
            if (success) {
                successCount++;
                log(`✅ [${i+1}/${ALL_PRODUCTS.length}] ${product.brand} - ${product.name} (${product.category})`, 'success');
            } else {
                failCount++;
                log(`❌ [${i+1}/${ALL_PRODUCTS.length}] FAILED: ${product.brand} - ${product.name}`, 'error');
            }
            
            // Small delay to avoid rate limiting
            await new Promise(r => setTimeout(r, 100));
        }
        
        log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
        log(`🎉 IMPORT COMPLETE!`, 'success');
        log(`✅ Successfully added: ${successCount} products`, 'success');
        if (failCount > 0) log(`❌ Failed: ${failCount} products`, 'error');
        log(`📊 Total: ${ALL_PRODUCTS.length} products processed`, 'info');
        log(`🔗 Go to Admin Panel: https://developereth.github.io/scentlover/admin.html`, 'info');
        
        btn.disabled = false;
        btn.textContent = '✅ Import Complete - Go to Admin Panel';
    }
    
    document.getElementById('importBtn').addEventListener('click', startImport);
</script>
</body>
</html>
