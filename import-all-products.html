        async function login() {
            const res = await fetch(`${API_URL}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: 'scentlovers', password: 'ScentLovers2026' })
            });
            const data = await res.json();
            return data.token;
        }

        async function addProduct(token, product) {
            const res = await fetch(`${API_URL}/api/admin/products`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Auth': token
                },
                body: JSON.stringify(product)
            });
            return res.ok;
        }

        document.getElementById('importBtn').onclick = async () => {
            const btn = document.getElementById('importBtn');
            const logDiv = document.getElementById('log');
            btn.disabled = true;
            btn.textContent = 'Importing...';
            
            logDiv.innerHTML = '🔐 Logging in...<br>';
            const token = await login();
            if (!token) {
                logDiv.innerHTML += '❌ Login failed!';
                btn.disabled = false;
                return;
            }
            logDiv.innerHTML += '✅ Logged in!<br>📦 Importing 35 products...<br>';
            
            let success = 0;
            for (let i = 0; i < PRODUCTS.length; i++) {
                const result = await addProduct(token, PRODUCTS[i]);
                if (result) {
                    success++;
                    logDiv.innerHTML += `✅ ${PRODUCTS[i].brand} - ${PRODUCTS[i].name}<br>`;
                } else {
                    logDiv.innerHTML += `❌ ${PRODUCTS[i].brand} - ${PRODUCTS[i].name}<br>`;
                }
                await new Promise(r => setTimeout(r, 100));
            }
            
            logDiv.innerHTML += `<br>🎉 COMPLETE! ${success}/${PRODUCTS.length} products added.`;
            logDiv.innerHTML += `<br>🔗 Go to: https://developereth.github.io/scentlover/admin.html`;
            btn.disabled = false;
            btn.textContent = '✅ Import Complete';
        };
