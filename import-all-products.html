<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Import - Scent Lovers</title>
    <style>
        body { font-family: monospace; background: #0A0A0A; color: #fff; padding: 20px; }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
        .info { color: #D4A853; }
        pre { background: #1a1a1a; padding: 10px; border-radius: 8px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 Debug Import - Test API First</h1>
    <div id="output"></div>
    
    <script>
        const API_URL = 'https://scent-lovers-api.developeraddis.workers.dev';
        const TOKEN = btoa('scentlovers:ScentLovers2026');
        
        function log(msg, type = 'info') {
            const div = document.getElementById('output');
            const color = type === 'success' ? '#27ae60' : (type === 'error' ? '#e74c3c' : '#D4A853');
            div.innerHTML += `<div style="color: ${color}">${msg}</div>`;
        }
        
        async function testAPI() {
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            log('🔍 TEST 1: Check if API is reachable');
            
            try {
                const testRes = await fetch(`${API_URL}/api/products`);
                const testData = await testRes.json();
                log(`✅ API is reachable! Response: ${JSON.stringify(testData).substring(0, 200)}`, 'success');
            } catch (e) {
                log(`❌ API not reachable: ${e.message}`, 'error');
                return;
            }
            
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            log('🔍 TEST 2: Login to get token');
            
            try {
                const loginRes = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'scentlovers', password: 'ScentLovers2026' })
                });
                const loginData = await loginRes.json();
                if (loginData.success) {
                    log(`✅ Login successful! Token: ${loginData.token.substring(0, 30)}...`, 'success');
                } else {
                    log(`❌ Login failed: ${JSON.stringify(loginData)}`, 'error');
                    return;
                }
            } catch (e) {
                log(`❌ Login error: ${e.message}`, 'error');
                return;
            }
            
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            log('🔍 TEST 3: Try adding ONE product');
            
            const testProduct = {
                name: "Debug Test Product",
                brand: "Debug Brand",
                price: "1,000 ETB",
                category: "women",
                image: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?w=400"
            };
            
            try {
                const addRes = await fetch(`${API_URL}/api/admin/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Auth': TOKEN
                    },
                    body: JSON.stringify(testProduct)
                });
                const addData = await addRes.json();
                if (addData.success) {
                    log(`✅ SUCCESS! Product added: ${testProduct.name}`, 'success');
                    log(`📦 Response: ${JSON.stringify(addData)}`, 'info');
                } else {
                    log(`❌ Failed to add product: ${JSON.stringify(addData)}`, 'error');
                }
            } catch (e) {
                log(`❌ Error adding product: ${e.message}`, 'error');
            }
            
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            log('💡 If TEST 3 failed, your Worker needs to be updated.', 'info');
            log('📋 Make sure your Worker has the /api/admin/products endpoint.', 'info');
        }
        
        testAPI();
    </script>
</body>
</html>
