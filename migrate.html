        async function migrateProducts() {
            log('Starting migration of ' + products.length + ' products...');
            
            // First, clear existing products (optional - comment out if you want to keep)
            // await fetch(`${API_URL}/api/admin/clear-products`, { method: 'DELETE', headers: { 'X-Admin-Auth': btoa('scentlovers:ScentLovers2026') } });
            
            let successCount = 0;
            let errorCount = 0;
            
            for (let i = 0; i < products.length; i++) {
                const product = products[i];
                const adminToken = btoa('scentlovers:ScentLovers2026');
                
                try {
                    const response = await fetch(`${API_URL}/api/admin/products`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Admin-Auth': adminToken
                        },
                        body: JSON.stringify(product)
                    });
                    
                    if (response.ok) {
                        successCount++;
                        log(`✅ Added: ${product.brand} - ${product.name} (${product.category})`, 'success');
                    } else {
                        errorCount++;
                        log(`❌ Failed: ${product.brand} - ${product.name}`, 'error');
                    }
                } catch (error) {
                    errorCount++;
                    log(`❌ Error: ${product.brand} - ${product.name} - ${error.message}`, 'error');
                }
                
                // Small delay to avoid rate limiting
                await new Promise(r => setTimeout(r, 100));
            }
            
            log(`\n========== MIGRATION COMPLETE ==========`, 'info');
            log(`✅ Successfully added: ${successCount} products`, 'success');
            log(`❌ Failed: ${errorCount} products`, errorCount > 0 ? 'error' : 'success');
            log(`\n📋 Total products in database: ${successCount}`, 'info');
            log(`\n🔗 Go to Admin Panel: https://developereth.github.io/scentlover/admin.html`, 'info');
        }
        
        migrateProducts();
